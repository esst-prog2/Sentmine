    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader.woff") format("woff"); font-weight: 200 800; font-style: normal; }
      @font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-Italic.woff") format("woff"); font-weight: 200 800; font-style: italic; }
      :root {
        --paper: #f3eee4; --panel: #fbf8f2; --ink: #23201b; --soft: #645d52; --line: #e2dbcc;
        --marker: #f6d84e; --pick: #c98a0b; --picked: #f8df7a; --link: #2d6f8e;
        --serif: "Newsreader", Georgia, serif; --ui: "Segoe UI", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--ui); overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      div.clip { z-index: 1; }
      video.screen { width: 1920px; height: 1080px; object-fit: fill; z-index: 0; }
      .outline { position: absolute; border: 3px solid rgba(120, 92, 40, 0.13); border-radius: 22px; }
      .caption { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); white-space: nowrap;
        background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 22px 44px 26px;
        font: 500 60px/1.1 var(--serif); letter-spacing: -0.01em; box-shadow: 0 2px 4px rgba(70, 52, 20, .08), 0 18px 48px rgba(70, 52, 20, .16); opacity: 0; }
      .caption b { font-weight: 500; background: var(--picked); border-radius: 6px; padding: 0 8px; }
      .caption i { font-style: italic; }
      .tag { position: absolute; left: 40px; top: 120px; font: 700 30px/1 var(--ui); letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--ink); background: var(--marker); border-radius: 10px; padding: 12px 18px; opacity: 0; }
      .note { position: absolute; right: 36px; top: 132px; font: 600 28px/1 var(--ui); color: var(--soft); background: var(--panel);
        border: 2px solid var(--line); border-radius: 12px; padding: 10px 16px; opacity: 0; }
      .hook { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font: 500 100px/1.1 var(--serif); letter-spacing: -0.015em; }
      .hook i { font-style: italic; background: var(--picked); border-radius: 10px; padding: 0 14px; }
      .sub { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font: 44px/1.2 var(--serif); color: var(--soft); opacity: 0; }
      .end-mark { position: absolute; left: 50%; top: 280px; width: 900px; margin-left: -450px; opacity: 0; }
      .end-mark svg { width: 100%; height: auto; display: block; }
      .end-line { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font: 500 64px/1.1 var(--serif); opacity: 0; }
      .end-address { position: absolute; left: 0; right: 0; top: 720px; text-align: center; font: 600 44px/1 var(--ui); color: var(--link); opacity: 0; }
      .end-note { position: absolute; left: 0; right: 0; top: 800px; text-align: center; font: 28px/1.2 var(--ui); color: var(--soft); opacity: 0; }
