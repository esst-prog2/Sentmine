[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentmine"
version = "0.1.0"
description = "Turn an English passage into an Anki deck of new words, each inside its own sentence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["genanki"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sentmine = "sentmine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentmine = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
