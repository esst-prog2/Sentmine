[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentmine"
version = "0.1.0"
description = "Turn what you read into Anki flashcards: a word inside its sentence, or a term with its definition."
readme = "README.md"
requires-python = ">=3.10"
# Pinned to the versions the tests were run with (Homework 6, review 6).
dependencies = ["genanki==0.13.1", "flask==3.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
sentmine = "sentmine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentmine = ["data/*.txt", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
