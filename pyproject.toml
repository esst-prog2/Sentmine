[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentmine"
version = "0.1.0"
description = "Turn what you read into Anki flashcards: a word inside its sentence, or a term with its definition."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["genanki", "flask"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sentmine = "sentmine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentmine = ["data/*.txt", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
