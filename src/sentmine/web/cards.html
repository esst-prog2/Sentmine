<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My cards · sentmine</title>
<script>
// Set the reader's chosen theme before the page is drawn, so it does not flash.
try {
  const chosen = localStorage.getItem("sentmine-theme");
  if (chosen === "light" || chosen === "dark") document.documentElement.dataset.theme = chosen;
} catch (error) {}   // no storage: follow the system
</script>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --soft: #5c6470; --line: #d9d6cd; --hover: #ecebe5;
    --accent: #1a5fd0; --selection: #c8dafc; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --page: #16181c; --panel: #1f2227; --ink: #e8e6e1; --soft: #a2a8b3; --line: #343841; --hover: #2a2e35;
      --accent: #6ea8ff; --selection: #2d4a7a; --warn: #ff8a80;
    }
  }
  :root[data-theme=dark] {
        --page: #16181c; --panel: #1f2227; --ink: #e8e6e1; --soft: #a2a8b3; --line: #343841; --hover: #2a2e35;
        --accent: #6ea8ff; --selection: #2d4a7a; --warn: #ff8a80;
  }
  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink); accent-color: var(--accent);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  ::selection { background: var(--selection); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.125rem; }
  h2 { margin: 0 0 10px; font-size: 1rem; }
  nav { display: flex; gap: 16px; }
  .spacer { flex: 1; }
  nav a { color: var(--soft); text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  nav a:hover { color: var(--ink); border-bottom-color: var(--line); }
  nav a[aria-current=page] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  main { max-width: 60rem; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #warning { color: var(--warn); margin: 0; }
  #warning:empty { display: none; }
  .numbers { display: flex; flex-wrap: wrap; gap: 12px 32px; }
  .number strong { display: block; font-size: 1.75rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .number span { color: var(--soft); font-size: 0.875rem; }
  #months { margin-top: 14px; color: var(--soft); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  #months b { color: var(--ink); }
  label[for=search] { display: block; color: var(--soft); font-size: 0.875rem; margin-bottom: 4px; }
  input[type=search] {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; width: 100%; max-width: 24rem; transition: border-color .15s;
  }
  input[type=search]:hover { border-color: var(--soft); }
  input[type=search]:focus-visible { border-color: var(--accent); outline-offset: 0; }
  #shown { color: var(--soft); margin: 10px 0 0; }
  .card { padding: 14px 0; }
  .card + .card, #shown + #cards > .card:first-child { border-top: 1px solid var(--line); }
  .card:last-child { padding-bottom: 0; }
  .card .front { margin: 0 0 8px; }
  .card .back { margin: 8px 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; font-size: 0.875rem; color: var(--soft); }
  .card .meta time { font-variant-numeric: tabular-nums; margin-right: auto; }
  button {
    font: inherit; font-size: 0.875rem; color: inherit; background: var(--page); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 10px; cursor: pointer; transition: background-color .15s, border-color .15s;
  }
  button:hover:not(:disabled) { background: var(--hover); border-color: var(--soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  #empty { color: var(--soft); margin: 12px 0 0; }
  @media (max-width: 600px) {
    header { padding-left: 16px; padding-right: 16px; }
    main { padding: 16px; gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    button:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>sentmine</h1>
  <nav aria-label="Pages"><a href="/">Read</a><a href="/cards" aria-current="page">My cards</a></nav>
  <span class="spacer"></span>
  <button type="button" id="theme">Dark mode</button>
</header>

<main>
  <p id="warning" role="alert"></p>

  <section aria-labelledby="progress-title">
    <h2 id="progress-title">Progress</h2>
    <div class="numbers">
      <div class="number"><strong id="total">0</strong><span id="kinds">cards</span></div>
      <div class="number"><strong id="week">0</strong><span>this week</span></div>
    </div>
    <div id="months"></div>
  </section>

  <section aria-labelledby="cards-title">
    <h2 id="cards-title">Remembered cards</h2>
    <label for="search">Search a word, term, sentence or meaning</label>
    <input type="search" id="search" autocomplete="off">
    <p id="shown"></p>
    <div id="cards"></div>
    <p id="empty" hidden>No cards yet. Cards appear here once you download a deck on the reading page.</p>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

function theme() {
  return document.documentElement.dataset.theme ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function drawThemeButton() {
  $("theme").textContent = theme() === "dark" ? "Light mode" : "Dark mode";
}

$("theme").addEventListener("click", () => {
  const next = theme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("sentmine-theme", next); } catch (error) {}   // remembered only if the browser allows it
  drawThemeButton();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawThemeButton);
drawThemeButton();
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
let searchTimer = null;

function element(tag, className, text) {
  const made = document.createElement(tag);
  if (className) made.className = className;
  if (text !== undefined) made.textContent = text;
  return made;
}

async function ask(method, url) {
  let response, data;
  try {
    response = await fetch(url, { method });
  } catch (error) {
    $("warning").textContent = "The app is not answering. Is `sentmine` still running in the terminal?";
    return null;
  }
  try {
    data = await response.json();
  } catch (error) {
    $("warning").textContent = "The app ran into an error (" + response.status + "). The terminal running `sentmine` shows what happened.";
    return null;
  }
  if (!response.ok) {
    $("warning").textContent = data.error || "Something went wrong.";
    return null;
  }
  return data;
}

function drawProgress(progress) {
  if (!progress) return;
  $("total").textContent = progress.total;
  $("kinds").textContent = (progress.total === 1 ? "card" : "cards") +
    ": " + progress.words + " word, " + progress.definitions + " definition";
  $("week").textContent = progress.this_week;
  const months = $("months");
  months.replaceChildren("Per month: ");
  progress.months.forEach((item, index) => {
    if (index > 0) months.append(" · ");
    const [year, month] = item.month.split("-");
    months.append(MONTH_NAMES[Number(month) - 1] + " " + year + " ", element("b", "", String(item.cards)));
  });
}

function drawCard(card) {
  const box = element("div", "card");
  const meta = element("div", "meta");
  const date = element("time", "", card.date);
  date.dateTime = card.date;
  const front = element("div", "front");
  front.innerHTML = card.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = card.back_html;
  const remove = element("button", "", "Delete");
  remove.addEventListener("click", async () => {
    if (!window.confirm("Forget this card? sentmine will no longer warn that you already have it. " +
                        "Your decks and Anki are not changed.")) return;
    remove.disabled = true;
    const data = await ask("DELETE", "/api/memory/" + card.id + "?q=" + encodeURIComponent($("search").value));
    if (data) draw(data); else remove.disabled = false;
  });
  meta.append(element("span", "", card.kind === "word" ? "Word" : "Definition"), date, remove);
  box.append(front, back, meta);
  return box;
}

function draw(data) {
  $("warning").textContent = data.memory_warning || "";
  drawProgress(data.progress);
  $("cards").replaceChildren(...data.cards.map(drawCard));
  const searching = $("search").value.trim() !== "";
  $("empty").hidden = data.total > 0 || searching;
  if (data.total === 0) {
    $("shown").textContent = searching ? "No card matches." : "";
  } else if (data.cards.length < data.total) {
    $("shown").textContent = "Showing the newest " + data.cards.length + " of " + data.total_text + ".";
  } else {
    $("shown").textContent = data.total_text + (searching ? " match." : ".");
  }
}

async function load() {
  const data = await ask("GET", "/api/memory?q=" + encodeURIComponent($("search").value));
  if (data) draw(data);
}

$("search").addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(load, 200);
});

load();
</script>
</body>
</html>
