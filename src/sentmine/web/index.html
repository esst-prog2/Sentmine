<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentmine</title>
<style>
  :root {
    --page: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --soft: #5c6470; --line: #d9d6cd;
    --accent: #1f6feb; --picked: #ffe27a; --term: #bfe3c6; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #16181c; --panel: #1f2227; --ink: #e8e6e1; --soft: #a2a8b3; --line: #343841;
      --accent: #6ea8ff; --picked: #7a6410; --term: #235c33; --warn: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.15rem; }
  h2 { margin: 0 0 10px; font-size: 1rem; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes label { padding: 5px 14px; cursor: pointer; }
  .modes input { position: absolute; opacity: 0; }
  .modes input:checked + span { font-weight: 600; color: var(--accent); }
  .modes label:has(input:checked) { background: var(--page); }
  .modes label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  #count { font-weight: 600; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .deck { display: flex; align-items: center; gap: 8px; }
  input[type=text], textarea {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  #deck-name { width: 9em; }
  button {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer;
  }
  button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 2px 10px; font-size: 0.9rem; }
  #status {
    min-height: 2.4em; padding: 8px 20px; color: var(--soft); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  #status.warn { color: var(--warn); }
  #status .term { background: var(--term); color: var(--ink); padding: 1px 6px; border-radius: 4px; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; padding: 20px; align-items: start; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  details summary { cursor: pointer; color: var(--soft); }
  #paste { width: 100%; min-height: 9em; margin: 10px 0; resize: vertical; }
  #text { margin-top: 14px; font: 1.1rem/1.8 Georgia, "Times New Roman", serif; }
  #text p { margin: 0 0 1em; }
  #text.empty { color: var(--soft); font: inherit; }
  body[data-mode=word] .w { cursor: pointer; border-radius: 3px; }
  body[data-mode=word] .w:hover { background: var(--line); }
  .w.picked { background: var(--picked); }
  body[data-mode=definition] #text { cursor: text; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .card .kind { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--soft); }
  .card .front { margin: 4px 0 8px; }
  .card .back { margin: 8px 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card .side-name { font-size: 0.8rem; color: var(--soft); display: block; margin-top: 6px; }
  .card textarea { width: 100%; min-height: 4.5em; resize: vertical; }
  .card .buttons { display: flex; gap: 8px; margin-top: 8px; }
  #no-cards { color: var(--soft); }
</style>
</head>
<body data-mode="word">

<header>
  <h1>sentmine</h1>
  <div class="modes" role="radiogroup" aria-label="What a pick makes">
    <label><input type="radio" name="mode" value="word" checked><span>Word</span></label>
    <label><input type="radio" name="mode" value="definition"><span>Definition</span></label>
  </div>
  <span id="count">0 cards</span>
  <span class="spacer"></span>
  <div class="deck">
    <label for="deck-name">Deck name</label>
    <input type="text" id="deck-name" value="new">
    <button class="main" id="download">Download</button>
  </div>
</header>

<div id="status" role="status"></div>

<main>
  <section>
    <details id="paste-box" open>
      <summary>Paste a text</summary>
      <textarea id="paste" placeholder="Paste the text you are reading here."></textarea>
      <button class="main" id="load">Read this text</button>
    </details>
    <div id="text" class="empty">No text yet.</div>
  </section>

  <section>
    <h2>Cards</h2>
    <div id="cards"></div>
    <div id="no-cards">No cards yet. In Word mode, click a word. In Definition mode, select a term, then drag over its definition.</div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const HINTS = {
  word: "Word mode: click a word to make a card from its sentence. Click it again to remove the card.",
  definition: "Definition mode: select the term first, then drag over the text that defines it.",
};

let state = { paragraphs: [], cards: [], count_text: "0 cards" };
let mode = "word";
let term = null;       // Definition mode: the term chosen, while its definition is still to be marked
let editing = null;    // the id of the card being edited

function element(tag, className, text) {
  const made = document.createElement(tag);
  if (className) made.className = className;
  if (text !== undefined) made.textContent = text;
  return made;
}

function say(message, warn) {
  const status = $("status");
  status.replaceChildren();
  status.classList.toggle("warn", Boolean(warn));
  if (mode === "definition" && term !== null && !warn) {
    status.append("Term: ", element("span", "term", term), " Now drag over its definition.");
    const cancel = element("button", "small", "Cancel");
    cancel.addEventListener("click", () => { term = null; say(""); });
    status.append(cancel);
    return;
  }
  status.textContent = message || HINTS[mode];
}

async function call(method, url, body) {
  let response, data;
  try {
    response = await fetch(url, {
      method,
      headers: body === undefined ? {} : { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    data = await response.json();
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return null;
  }
  if (!response.ok) {
    say(data.error || "Something went wrong.", true);
    return null;
  }
  state = data;
  draw();
  say(data.message, data.result === "duplicate");
  return data;
}

function drawText() {
  const text = $("text");
  text.replaceChildren();
  text.classList.toggle("empty", state.paragraphs.length === 0);
  if (state.paragraphs.length === 0) {
    text.textContent = "No text yet.";
    return;
  }
  for (const paragraph of state.paragraphs) {
    const p = element("p");
    paragraph.forEach((sentence, index) => {
      if (index > 0) p.append(" ");
      for (const piece of sentence.pieces) {
        if (piece.word === undefined) {
          p.append(piece.text);
          continue;
        }
        const word = element("span", piece.picked ? "w picked" : "w", piece.text);
        word.dataset.sentence = sentence.sentence;
        word.dataset.word = piece.word;
        p.append(word);
      }
    });
    text.append(p);
  }
}

function drawCard(card) {
  const box = element("div", "card");
  box.append(element("div", "kind", card.kind === "word" ? "Word" : "Definition"));

  if (editing === card.id) {
    const front = element("textarea");
    front.value = card.front;
    const back = element("textarea");
    back.value = card.back;
    const save = element("button", "main small", "Save");
    save.addEventListener("click", async () => {
      const done = await call("PUT", "/api/cards/" + card.id, { front: front.value, back: back.value });
      if (done) { editing = null; draw(); }
    });
    const cancel = element("button", "small", "Cancel");
    cancel.addEventListener("click", () => { editing = null; draw(); });
    const buttons = element("div", "buttons");
    buttons.append(save, cancel);
    box.append(element("span", "side-name", "Front"), front, element("span", "side-name", "Back"), back, buttons);
    return box;
  }

  const front = element("div", "front");
  front.innerHTML = card.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = card.back_html;
  const edit = element("button", "small", "Edit");
  edit.addEventListener("click", () => { editing = card.id; draw(); });
  const remove = element("button", "small", "Delete");
  remove.addEventListener("click", () => call("DELETE", "/api/cards/" + card.id));
  const buttons = element("div", "buttons");
  buttons.append(edit, remove);
  box.append(front, back, buttons);
  return box;
}

function draw() {
  drawText();
  $("count").textContent = state.count_text;
  $("cards").replaceChildren(...state.cards.map(drawCard));
  $("no-cards").hidden = state.cards.length > 0;
}

function setMode(next) {
  mode = next;
  term = null;
  document.body.dataset.mode = next;
  window.getSelection().removeAllRanges();
  say("");
}

for (const radio of document.querySelectorAll("input[name=mode]")) {
  radio.addEventListener("change", () => setMode(radio.value));
}

$("text").addEventListener("click", (event) => {
  if (mode !== "word" || !event.target.classList.contains("w")) return;
  if (!window.getSelection().isCollapsed) return;   // the reader was selecting, not clicking
  call("POST", "/api/word", {
    sentence: Number(event.target.dataset.sentence),
    word: Number(event.target.dataset.word),
  });
});

document.addEventListener("mouseup", () => {   // on the document: a drag may end outside the text
  if (mode !== "definition") return;
  const selection = window.getSelection();
  const selected = selection.toString().trim();
  if (!selected || !$("text").contains(selection.anchorNode)) return;
  selection.removeAllRanges();
  if (term === null) {
    term = selected.replace(/\s+/g, " ");
    say("");
    return;
  }
  const chosen = term;
  term = null;
  call("POST", "/api/definition", { term: chosen, passage: selected });
});

$("load").addEventListener("click", async () => {
  if (state.cards.length > 0 &&
      !window.confirm("Reading a new text removes the " + state.count_text + " you have not downloaded. Continue?")) {
    return;
  }
  const done = await call("POST", "/api/text", { text: $("paste").value });
  if (done) {
    editing = null;
    term = null;
    $("paste").value = "";
    $("paste-box").open = false;
    $("paste-box").querySelector("summary").textContent = "Paste another text";
  }
});

$("download").addEventListener("click", async () => {
  let response;
  try {
    response = await fetch("/api/deck?name=" + encodeURIComponent($("deck-name").value));
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return;
  }
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    say(data.error || "The deck could not be made.", true);
    return;
  }
  const named = /filename="?([^";]+)"?/.exec(response.headers.get("Content-Disposition") || "");
  const link = element("a");
  link.href = URL.createObjectURL(await response.blob());
  link.download = named ? named[1] : ($("deck-name").value.trim() || "new") + ".apkg";
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
  say("Downloaded " + link.download + " with " + state.count_text + ".");
});

call("GET", "/api/state").then((loaded) => {
  if (loaded && loaded.paragraphs.length > 0) {
    $("paste-box").open = false;
    $("paste-box").querySelector("summary").textContent = "Paste another text";
  }
});
</script>
</body>
</html>
