<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sentmine</title>
<script>
// Set the reader's chosen theme before the page is drawn, so it does not flash.
try {
  const chosen = localStorage.getItem("sentmine-theme");
  if (chosen === "light" || chosen === "dark") document.documentElement.dataset.theme = chosen;
} catch (error) {}   // no storage: follow the system
</script>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f5f1; --panel: #ffffff; --ink: #1f2328; --soft: #5c6470; --line: #d9d6cd; --hover: #ecebe5;
    --accent: #1a5fd0; --accent-hover: #154fae; --on-accent: #ffffff; --selection: #c8dafc;
    --picked: #ffe27a; --term: #bfe3c6; --warn: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --page: #16181c; --panel: #1f2227; --ink: #e8e6e1; --soft: #a2a8b3; --line: #343841; --hover: #2a2e35;
      --accent: #6ea8ff; --accent-hover: #8fbcff; --on-accent: #0d1117; --selection: #2d4a7a;
      --picked: #7a6410; --term: #235c33; --warn: #ff8a80;
    }
  }
  :root[data-theme=dark] {
        --page: #16181c; --panel: #1f2227; --ink: #e8e6e1; --soft: #a2a8b3; --line: #343841; --hover: #2a2e35;
        --accent: #6ea8ff; --accent-hover: #8fbcff; --on-accent: #0d1117; --selection: #2d4a7a;
        --picked: #7a6410; --term: #235c33; --warn: #ff8a80;
  }
  :root[data-theme=light] { color-scheme: light; }
  :root[data-theme=dark] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink); accent-color: var(--accent);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  ::selection { background: var(--selection); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.125rem; }
  h2 { margin: 0 0 4px; font-size: 1rem; }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--soft); text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  nav a:hover { color: var(--ink); border-bottom-color: var(--line); }
  nav a[aria-current=page] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  #count { font-weight: 600; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .deck { display: flex; align-items: center; gap: 8px; }
  input[type=text], textarea {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    transition: border-color .15s;
  }
  input[type=text]:hover, textarea:hover { border-color: var(--soft); }
  input[type=text]:focus-visible, textarea:focus-visible { border-color: var(--accent); outline-offset: 0; }
  #deck-name { width: 9em; }
  button, ::file-selector-button {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; transition: background-color .15s, border-color .15s;
  }
  button:hover:not(:disabled), ::file-selector-button:hover { background: var(--hover); border-color: var(--soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.main:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.small { padding: 2px 10px; font-size: 0.875rem; }
  #status {
    min-height: 2.4em; padding: 8px 20px; color: var(--soft); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  #status.warn { color: var(--warn); }
  #status .term { background: var(--term); color: var(--ink); padding: 1px 6px; border-radius: 4px; }
  main { display: grid; grid-template-columns: minmax(0, min(50rem, 60%)) minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  details summary { cursor: pointer; color: var(--soft); width: fit-content; }
  details summary:hover { color: var(--ink); }
  .file { margin-left: 12px; color: var(--soft); }
  #paste { width: 100%; min-height: 9em; margin: 10px 0; resize: vertical; }
  #text { margin-top: 14px; font: 1.125rem/1.8 Georgia, "Times New Roman", serif; max-width: 42em; }
  #text p { margin: 0 0 1em; }
  #text.empty { color: var(--soft); font: inherit; }
  #paste-box[open] + #text.empty { display: none; }
  .w { cursor: pointer; border-radius: 3px; transition: background-color .15s; }
  .w:hover { background: var(--hover); }
  .w.picked, .w.picked:hover { background: var(--picked); }
  .card { padding: 14px 0; }
  .card + .card { border-top: 1px solid var(--line); }
  .card:last-child { padding-bottom: 0; }
  .card .front { margin: 0 0 8px; }
  .card .back { margin: 8px 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card .side-name { font-size: 0.875rem; color: var(--soft); display: block; margin-top: 6px; }
  .card textarea { width: 100%; min-height: 4.5em; resize: vertical; }
  .buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .card .kind { font-size: 0.875rem; color: var(--soft); margin-right: auto; }
  #no-cards { color: var(--soft); margin: 10px 0 0; }
  #status.earlier { flex-direction: column; align-items: flex-start; color: var(--ink); }
  .earlier-card { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; max-width: 60em; background: var(--panel); }
  .earlier-card .back { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .made-before { font-size: 0.875rem; color: var(--soft); margin-bottom: 6px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    header, #status { padding-left: 16px; padding-right: 16px; }
    main { padding: 16px; gap: 16px; }
    .spacer { display: none; }
    .deck { width: 100%; flex-wrap: wrap; }
    #deck-name { flex: 1 1 8em; min-width: 0; }
    .file { display: block; margin: 10px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    button:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>sentmine</h1>
  <nav aria-label="Pages"><a href="/" aria-current="page">Read</a><a href="/cards">My cards</a></nav>
  <span id="count">0 cards</span>
  <span class="spacer"></span>
  <div class="deck">
    <label for="deck-name">Deck name</label>
    <input type="text" id="deck-name" value="new">
    <button id="download">Download</button>
    <button class="main" id="send">Send to Anki</button>
  </div>
  <button type="button" id="theme" class="small">Dark mode</button>
</header>

<div id="status" role="status"></div>

<main>
  <section>
    <details id="paste-box" open>
      <summary>Paste a text or open a file</summary>
      <textarea id="paste" placeholder="Paste the text you are reading here."></textarea>
      <button class="main" id="load">Read this text</button>
      <label class="file">or open a PDF or text file:
        <input type="file" id="file" accept=".pdf,.txt">
      </label>
    </details>
    <div id="text" class="empty">No text yet.</div>
  </section>

  <section>
    <h2>Cards</h2>
    <div id="cards"></div>
    <div id="no-cards">No cards yet. Click a word for a word card. For a definition card, drag over a term, then over its definition.</div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

function theme() {
  return document.documentElement.dataset.theme ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function drawThemeButton() {
  $("theme").textContent = theme() === "dark" ? "Light mode" : "Dark mode";
}

$("theme").addEventListener("click", () => {
  const next = theme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("sentmine-theme", next); } catch (error) {}   // remembered only if the browser allows it
  drawThemeButton();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawThemeButton);
drawThemeButton();
const HINT = "Click a word for a card from its sentence; click it again to remove the card. " +
  "Drag over a term, then over its definition, for a definition card.";

let state = { paragraphs: [], cards: [], count_text: "0 cards" };
let term = null;       // the term dragged over, while its definition is still to be marked
let editing = null;    // the id of the card being edited
let lastPick = null;   // the last word click or definition sent, so "Make it anyway" can send it again

function element(tag, className, text) {
  const made = document.createElement(tag);
  if (className) made.className = className;
  if (text !== undefined) made.textContent = text;
  return made;
}

function say(message, warn) {
  const status = $("status");
  status.replaceChildren();
  status.classList.remove("earlier");
  status.classList.toggle("warn", Boolean(warn));
  if (term !== null && !warn) {
    status.append("Term: ", element("span", "term", term), " Now drag over its definition.");
    const cancel = element("button", "small", "Cancel (Esc)");
    cancel.addEventListener("click", () => { term = null; say(""); });
    status.append(cancel);
    return;
  }
  status.textContent = message || HINT;
}

function showEarlier(data) {
  const status = $("status");
  status.replaceChildren();
  status.classList.remove("warn");
  status.classList.add("earlier");
  const card = element("div", "earlier-card");
  const front = element("div", "front");
  front.innerHTML = data.earlier.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = data.earlier.back_html;
  card.append(front, back);
  const skip = element("button", "small", "Skip");
  skip.addEventListener("click", () => say("Skipped: no new card."));
  const anyway = element("button", "main small", "Make it anyway");
  const request = lastPick;
  anyway.addEventListener("click", () => call("POST", request.url, { ...request.body, anyway: true }));
  const buttons = element("div", "buttons");
  buttons.append(skip, anyway);
  status.append(element("span", "", data.message), card, buttons);
}

function pick(url, body) {
  lastPick = { url, body };
  return call("POST", url, body);
}

async function call(method, url, body) {
  let response, data;
  try {
    response = await fetch(url, {
      method,
      headers: body === undefined || body instanceof FormData ? {} : { "Content-Type": "application/json" },
      body: body === undefined || body instanceof FormData ? body : JSON.stringify(body),
    });
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return null;
  }
  try {
    data = await response.json();
  } catch (error) {
    // The app answered, but not with JSON: an error inside the app, not a lost connection.
    say("The app ran into an error (" + response.status + "). The terminal running `sentmine` shows what happened.", true);
    return null;
  }
  if (!response.ok) {
    say(data.error || "Something went wrong.", true);
    return null;
  }
  state = data;
  draw();
  if (data.result === "earlier") {
    showEarlier(data);
  } else {
    say(data.message, data.result === "duplicate" || data.result === "warning");
  }
  return data;
}

function drawText() {
  const text = $("text");
  text.replaceChildren();
  text.classList.toggle("empty", state.paragraphs.length === 0);
  if (state.paragraphs.length === 0) {
    text.textContent = "No text yet.";
    return;
  }
  for (const paragraph of state.paragraphs) {
    const p = element("p");
    paragraph.forEach((sentence, index) => {
      if (index > 0) p.append(" ");
      for (const piece of sentence.pieces) {
        if (piece.word === undefined) {
          p.append(piece.text);
          continue;
        }
        const word = element("span", piece.picked ? "w picked" : "w", piece.text);
        word.dataset.sentence = sentence.sentence;
        word.dataset.word = piece.word;
        p.append(word);
      }
    });
    text.append(p);
  }
}

async function busy(button, label, work) {
  const idle = button.textContent;
  button.disabled = true;
  button.textContent = label;
  try {
    await work();
  } finally {
    button.disabled = false;
    button.textContent = idle;
  }
}

function drawCard(card) {
  const box = element("div", "card");
  const kind = element("span", "kind",
    card.kind === "word" ? "Word" : card.cloze ? "Definition · cloze" : "Definition · term → passage");

  if (editing === card.id) {
    const front = element("textarea");
    front.value = card.front;
    const back = element("textarea");
    back.value = card.back;
    const save = element("button", "main small", "Save");
    save.addEventListener("click", async () => {
      const done = await call("PUT", "/api/cards/" + card.id, { front: front.value, back: back.value });
      if (done) { editing = null; draw(); }
    });
    const cancel = element("button", "small", "Cancel");
    cancel.addEventListener("click", () => { editing = null; draw(); });
    const buttons = element("div", "buttons");
    buttons.append(kind, save, cancel);
    const names = card.kind === "word" ? ["Front", "Back"] : ["Term", "Passage"];
    box.append(element("span", "side-name", names[0]), front, element("span", "side-name", names[1]), back, buttons);
    return box;
  }

  const front = element("div", "front");
  front.innerHTML = card.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = card.back_html;
  if (card.earlier) box.append(element("div", "made-before", "Made before, on " + card.earlier + "."));
  const edit = element("button", "small", "Edit");
  edit.addEventListener("click", () => { editing = card.id; draw(); });
  const remove = element("button", "small", "Delete");
  remove.addEventListener("click", () => call("DELETE", "/api/cards/" + card.id));
  const buttons = element("div", "buttons");
  buttons.append(kind, edit, remove);
  if (card.kind === "definition" && (card.cloze || card.can_cloze)) {
    const other = element("button", "small", card.cloze ? "Make it term → passage" : "Make it cloze");
    other.addEventListener("click", () => call("PUT", "/api/cards/" + card.id + "/cloze", { cloze: !card.cloze }));
    buttons.append(other);
  }
  if (card.kind === "word" && state.can_suggest) {
    const suggest = element("button", "small", "Suggest meaning");
    suggest.addEventListener("click", async () => {
      suggest.disabled = true;
      suggest.textContent = "Asking…";
      const done = await call("POST", "/api/cards/" + card.id + "/meaning");
      if (!done) {   // the message says why; the card has not changed
        suggest.disabled = false;
        suggest.textContent = "Suggest meaning";
      }
    });
    buttons.append(suggest);
  }
  box.append(front, back, buttons);
  return box;
}

function draw() {
  drawText();
  $("count").textContent = state.count_text;
  $("cards").replaceChildren(...state.cards.map(drawCard));
  $("no-cards").hidden = state.cards.length > 0;
}

// One handler tells a click from a drag. It listens on the document because a drag may end
// outside the text, and on mouseup because a click handler would come after the drag's
// selection is cleared, and so would take every drag inside one word for a click.
document.addEventListener("mouseup", (event) => {
  if (event.button !== 0) return;
  const selection = window.getSelection();
  const selected = selection.toString().trim();
  const inText = selected && $("text").contains(selection.anchorNode);
  if (event.detail >= 2) {   // a double- or triple-click selects a word or paragraph; its first click counted
    if (inText) selection.removeAllRanges();
    return;
  }
  if (inText) {
    selection.removeAllRanges();
    if (term === null) {
      term = selected.replace(/\s+/g, " ");
      say("");
      return;
    }
    const chosen = term;
    term = null;
    pick("/api/definition", { term: chosen, passage: selected });
    return;
  }
  if (selected || !event.target.classList.contains("w") || !$("text").contains(event.target)) return;
  term = null;   // a click on a word drops a waiting term
  pick("/api/word", {
    sentence: Number(event.target.dataset.sentence),
    word: Number(event.target.dataset.word),
  });
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && term !== null) {
    term = null;
    say("");
  }
});

function mayReplaceCards() {
  return state.cards.length === 0 ||
    window.confirm("Reading a new text removes the " + state.count_text + " you have not downloaded. Continue?");
}

function textLoaded() {
  editing = null;
  term = null;
  $("paste").value = "";
  $("paste-box").open = false;
  $("paste-box").querySelector("summary").textContent = "Paste or open another text";
}

$("load").addEventListener("click", () => {
  if (!mayReplaceCards()) return;
  busy($("load"), "Reading…", async () => {
    if (await call("POST", "/api/text", { text: $("paste").value })) textLoaded();
  });
});

$("file").addEventListener("change", async () => {
  const chosen = $("file").files[0];
  if (chosen && mayReplaceCards()) {
    say("Reading " + chosen.name + "…");
    const form = new FormData();
    form.append("file", chosen);
    $("file").disabled = true;
    try {
      if (await call("POST", "/api/file", form)) textLoaded();
    } finally {
      $("file").disabled = false;
    }
  }
  $("file").value = "";   // so that choosing the same file again works
});

$("download").addEventListener("click", () => busy($("download"), "Making the deck…", download));
$("send").addEventListener("click", () =>
  busy($("send"), "Sending…", () => call("POST", "/api/send", { deck: $("deck-name").value })));

async function download() {
  let response;
  try {
    response = await fetch("/api/deck?name=" + encodeURIComponent($("deck-name").value));
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return;
  }
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    say(data.error || "The deck could not be made.", true);
    return;
  }
  const named = /filename="?([^";]+)"?/.exec(response.headers.get("Content-Disposition") || "");
  const link = element("a");
  link.href = URL.createObjectURL(await response.blob());
  link.download = named ? named[1] : ($("deck-name").value.trim() || "new") + ".apkg";
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
  const warning = response.headers.get("X-Sentmine-Warning");
  if (warning) {
    say("Downloaded " + link.download + ". " + decodeURIComponent(warning), true);
  } else {
    say("Downloaded " + link.download + " (" + state.count_text + "). Now in My cards too.");
  }
}

call("GET", "/api/state").then((loaded) => {
  if (loaded && loaded.memory_warning) {
    say(loaded.memory_warning + " Earlier cards will not be found, and new ones will not be remembered.", true);
  }
  if (loaded && loaded.paragraphs.length > 0) {
    $("paste-box").open = false;
    $("paste-box").querySelector("summary").textContent = "Paste or open another text";
  }
});
</script>
</body>
</html>
