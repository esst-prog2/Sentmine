  * { box-sizing: border-box; }
  /* a card open in Edit: a box drawn on a PDF page is a picture for it; a mark shows where the next thing goes */
  body.editing-pdf .pdf-page, body.editing-pdf .pdf-page .w { cursor: crosshair; }
  .card.editing-card { position: relative; }
  .caret-mark { position: absolute; width: 2px; background: var(--accent); border-radius: 1px; pointer-events: none; }
  body {
    margin: 0; background: var(--page); color: var(--ink); accent-color: var(--accent);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }
  ::selection { background: var(--selection); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.125rem; }
  h2 { margin: 0 0 4px; font-size: 1rem; }
  nav { display: flex; gap: 16px; }
  nav a { color: var(--soft); text-decoration: none; padding: 2px 0; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  nav a:hover { color: var(--ink); border-bottom-color: var(--line); }
  nav a[aria-current=page] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  #count { font-weight: 600; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .deck { display: flex; align-items: center; gap: 8px; }
  input[type=text], textarea {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    transition: border-color .15s;
  }
  input[type=text]:hover, textarea:hover { border-color: var(--soft); }
  input[type=text]:focus-visible, textarea:focus-visible { border-color: var(--accent); outline-offset: 0; }
  #deck-name { width: 9em; }
  button, ::file-selector-button {
    font: inherit; color: inherit; background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; transition: background-color .15s, border-color .15s;
  }
  button:hover:not(:disabled), ::file-selector-button:hover { background: var(--hover); border-color: var(--soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.main:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.small { padding: 2px 10px; font-size: 0.875rem; }
  #status {
    min-height: 2.4em; padding: 8px 20px; color: var(--soft); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--page);
  }
  #status.warn { color: var(--warn); }
  #status .term { background: var(--term); color: var(--ink); padding: 1px 6px; border-radius: 4px; }
  main { display: grid; grid-template-columns: minmax(0, min(50rem, 60%)) minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  details summary { cursor: pointer; color: var(--soft); width: fit-content; }
  details summary:hover { color: var(--ink); }
  .file { margin-left: 12px; color: var(--soft); }
  #paste { width: 100%; min-height: 9em; margin: 10px 0; resize: vertical; }
  #text { margin-top: 14px; font: 1.125rem/1.8 Georgia, "Times New Roman", serif; max-width: 42em; }
  #text p { margin: 0 0 1em; }
  #text.empty { color: var(--soft); font: inherit; }
  #paste-box[open] + #text.empty { display: none; }
  body.clip #paste-box[open] + #text.empty { display: block; }   /* the panel has no paste box: say what to do */
  .w { cursor: pointer; border-radius: 3px; transition: background-color .15s; }
  .w:hover { background: var(--hover); }
  .w.picked, .w.picked:hover { background: var(--picked); }
  .w.known { text-decoration: underline solid var(--accent) 2px; text-underline-offset: 4px; }
  #text.pdf { max-width: none; }
  .pdf-page {
    position: relative; margin: 0 0 16px; background: #fff; border: 1px solid var(--line); border-radius: 4px;
    container-type: size; overflow: hidden;
  }
  .pdf-page img { display: block; width: 100%; height: 100%; user-select: none; pointer-events: none; }
  .pdf-page .w {
    position: absolute; color: transparent; white-space: pre; line-height: 1; overflow: hidden;
    font-family: system-ui, sans-serif; border-radius: 2px;
  }
  .pdf-page .w::selection { background: rgba(26, 95, 208, 0.35); color: transparent; }
  .pdf-page .w:hover { background: rgba(26, 95, 208, 0.16); }
  .pdf-page .w.picked, .pdf-page .w.picked:hover { background: rgba(255, 196, 0, 0.45); }
  .pdf-page .w.dragged, .pdf-page .w.dragged:hover { background: rgba(26, 95, 208, 0.3); }
  #text .w.dragged { background: var(--selection); }
  /* the PDF's own links: to another page in sentmine, or to a website in a new tab */
  .pdf-page .pdf-link { position: absolute; z-index: 2; border-radius: 2px; cursor: pointer; }
  .pdf-page .pdf-link:hover, .pdf-page .pdf-link:focus-visible { background: rgba(26, 95, 208, 0.14); outline: 1px solid rgba(26, 95, 208, 0.5); }
  /* the page bar, at the bottom of the reading area while a PDF is open */
  #pdf-nav { position: sticky; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 14px; width: fit-content;
    margin: 12px auto 0; padding: 6px 8px 6px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14); font-size: 0.9375rem; }
  #pdf-nav[hidden] { display: none; }
  #pdf-nav input { width: 4.2em; padding: 3px 6px; }
  #contents { position: relative; }
  #contents summary { cursor: pointer; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); list-style: none; }
  #contents summary::-webkit-details-marker { display: none; }
  #contents ol { position: absolute; bottom: calc(100% + 10px); right: 0; width: min(26rem, 80vw); max-height: 60vh; overflow: auto;
    margin: 0; padding: 8px; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18); }
  #contents li button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; font: inherit; color: var(--ink); cursor: pointer; }
  #contents li button:hover { background: var(--hover); }
  /* a formula or graph from the page, on the back of a card */
  /* the words that show a suggested meaning */
  .card .back u { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .card .front img, .card .back img, .doc-editor img { display: block; max-width: 100%; height: auto; margin: 6px 0;
    background: #ffffff; border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
  /* the back of a card being edited: a small document of text and pictures */
  .doc-editor { min-height: 2.5em; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--page); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  .back-editor { min-height: 4.5em; }
  .doc-editor:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .front-editor:empty::before { content: "Type the term"; color: var(--soft); }
  .doc-editor img { cursor: pointer; }
  .card .paste-hint { font-size: 0.8125rem; color: var(--soft); margin-top: 8px; }
  /* the side panel: the card that pictures from the web page go to */
  .card .origin { font-size: 0.8125rem; color: var(--soft); margin-bottom: 4px; }
  body.boxing .pdf-page, body.boxing .pdf-page .w { cursor: crosshair; }
  .pdf-page .box-drawn { position: absolute; border: 2px solid var(--accent); background: rgba(26, 95, 208, 0.1); pointer-events: none; }
  /* the keyboard: one stop on the text, then the arrow keys from word to word */
  #text:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  #text .w:focus { outline: none; }
  #text .w:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* A word you already have a card for: a strong blue line, a dot in the margin on its line, and a count
     at the page's corner, so cards coming back are seen while scrolling. The page stays white in dark mode,
     so these keep their light colours. */
  .pdf-page .w.known { text-decoration: none; border-bottom: 2.5px solid rgba(26, 95, 208, 0.95); }
  .pdf-page .known-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #1a5fd0;
    transform: translate(-50%, -50%); pointer-events: none; }
  .pdf-page .known-count { position: absolute; top: 8px; right: 10px; font: 600 0.75rem system-ui, sans-serif;
    color: #1a5fd0; background: #eef3fc; border: 1px solid #c8dafc; border-radius: 999px; padding: 2px 9px; }
  #known-card {
    position: fixed; z-index: 3; max-width: 26rem; padding: 10px 12px; pointer-events: none;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); font: 0.9375rem/1.45 system-ui, "Segoe UI", sans-serif;
  }
  #known-card .made { color: var(--soft); font-size: 0.8125rem; margin-bottom: 4px; }
  #known-card .met { color: var(--accent); }
  #known-card .back { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .pdf-page .page-number { position: absolute; right: 8px; bottom: 6px; font: 0.75rem system-ui, sans-serif; color: #5c6470; }
  @media (min-width: 801px) {
    #status { position: sticky; top: var(--header, 0px); z-index: 1; }
    main:has(#text.pdf) { grid-template-columns: minmax(0, 1fr) minmax(0, 28rem); }
    main > section:last-child { position: sticky; top: calc(var(--header, 0px) + var(--status, 0px) + 20px);
      max-height: calc(100vh - var(--header, 0px) - var(--status, 0px) - 40px); overflow: auto; }
  }
  .card { padding: 14px 0; }
  .card + .card { border-top: 1px solid var(--line); }
  .card:last-child { padding-bottom: 0; }
  .card .front { margin: 0 0 8px; }
  .card .back { margin: 8px 0; padding-top: 8px; border-top: 1px dashed var(--line); }
  .card .side-name { font-size: 0.875rem; color: var(--soft); display: block; margin-top: 6px; }
  .card textarea { width: 100%; min-height: 4.5em; resize: vertical; }
  .buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .card .kind { font-size: 0.875rem; color: var(--soft); margin-right: auto; }
  #no-cards { color: var(--soft); margin: 10px 0 0; }
  #status.earlier { flex-direction: column; align-items: flex-start; color: var(--ink); }
  .earlier-card { border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; max-width: 60em; background: var(--panel); }
  .earlier-card .back { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .made-before { font-size: 0.875rem; color: var(--soft); margin-bottom: 6px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    header, #status { padding-left: 16px; padding-right: 16px; }
    main { padding: 16px; gap: 16px; }
    .spacer { display: none; }
    .deck { width: 100%; flex-wrap: wrap; }
    #deck-name { flex: 1 1 8em; min-width: 0; }
    .file { display: block; margin: 10px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    button:active:not(:disabled) { transform: none; }
  }
  /* Going between Read and My cards: the content fades and the header stays where it is. */
  @media (prefers-reduced-motion: no-preference) {
    @view-transition { navigation: auto; }
    ::view-transition-group(*) { animation-duration: .15s; }
  }
  /* Clip mode (/clip): the side panel beside a web page. One column, no paste box, a label on each clip. */
  body.clip nav, body.clip #paste-box, body.clip .spacer { display: none; }
  body.clip main { grid-template-columns: 1fr; }
  body.clip main > section:first-child { display: none; }   /* the panel shows the cards; each right-click made its own */
  .clip + .clip { border-top: 1px solid var(--line); padding-top: 14px; }
  /* In the side panel the header is one slim row; the deck name, Download and Send to Anki sit in a bar at the
     bottom, where the reader ends up after making cards. The theme follows the app's own choice. */
  .mycards { display: none; color: var(--soft); font-size: 0.875rem; text-decoration: none; white-space: nowrap; }
  .mycards:hover { color: var(--accent); }
  body.clip .mycards { display: inline; margin-left: auto; }
  body.clip #theme { display: none; }
  body.clip header { flex-wrap: nowrap; }
  body.clip #status { position: sticky; top: var(--header, 0px); z-index: 1; }
  body.clip header .deck { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; width: auto; display: flex; flex-wrap: nowrap;
    gap: 8px; padding: 10px 16px; background: var(--brand); border-top: 0; box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.12); }
  body.clip header .deck label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  body.clip #deck-name { flex: 1 1 auto; min-width: 0; }
  body.clip #download, body.clip #send { white-space: nowrap; }
  body.clip main { padding-bottom: 84px; }
  .clip-head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font: 0.8125rem system-ui, sans-serif; color: var(--soft); margin-bottom: 4px; }
  body > header { view-transition-name: app-header; }

  /* sentmine's look: a blue bar with the mark, cards that look like cards, faint cards on the page ground */
  body { background: var(--page) var(--pattern) fixed; }
  header { background: var(--brand); color: var(--on-brand); border-bottom: 0; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.08); }
  .brand { display: flex; align-items: center; gap: 8px; margin: 0; line-height: 1; }
  .brand .mark { width: 30px; height: 30px; flex: none; }
  .brand .wordmark { height: 22px; width: auto; color: var(--on-brand); }
  header nav a { color: var(--on-brand-soft); }
  header nav a:hover { color: var(--on-brand); border-bottom-color: rgba(255, 255, 255, 0.4); }
  header nav a[aria-current=page] { color: var(--on-brand); border-bottom-color: var(--amber); }
  header a.mycards { color: var(--on-brand-soft); }
  header label { color: var(--on-brand-soft); }
  header input[type=text], header input[type=search] { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); color: var(--on-brand); }
  header input::placeholder { color: var(--on-brand-soft); }
  header input[type=text]:hover { border-color: rgba(255, 255, 255, 0.6); }
  header button { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.32); color: var(--on-brand); }
  header button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); border-color: rgba(255, 255, 255, 0.6); }
  header button.main { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
  header button.main:hover:not(:disabled) { background: #ffb43d; border-color: #ffb43d; }
  header :focus-visible { outline-color: var(--amber); }
  section { border-radius: 14px; }   /* panels stay flat: only cards lift */
  #cards { display: grid; gap: 12px; }
  .card, .card + .card { background: var(--panel); border: 1px solid var(--line); border-top: 1px solid var(--line); border-radius: 12px;
    padding: 0 14px 12px; box-shadow: var(--lift); overflow: hidden; }
  .card .front { margin: 0 -14px 10px; padding: 10px 14px; background: var(--band); }
  .card.is-cloze .front { background: var(--band-cloze); }
  .card.is-cloze .kind { color: var(--kind-cloze); font-weight: 600; }
  .card .back { border-top: 0; padding-top: 0; }
  .card .origin { margin: 4px 0 0; }
  main > section:last-child { background: var(--cards-bg); border-color: transparent; box-shadow: none; }   /* a tray: only its cards lift */
  main > section:last-child h2 { color: var(--cards-title); }
</style>

<!-- first data -->
<script>
"use strict";

const $ = (id) => document.getElementById(id);

function theme() {
  return document.documentElement.dataset.theme ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

function drawThemeButton() {
  $("theme").textContent = theme() === "dark" ? "Light mode" : "Dark mode";
}

$("theme").addEventListener("click", () => {
  const next = theme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("sentmine-theme", next); } catch (error) {}   // remembered only if the browser allows it
  drawThemeButton();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawThemeButton);
new ResizeObserver(() => {   // the status line and the cards stay in view under the header while the text scrolls
  document.documentElement.style.setProperty("--header", document.querySelector("header").offsetHeight + "px");
  document.documentElement.style.setProperty("--status", $("status").offsetHeight + "px");
}).observe(document.body);
drawThemeButton();
// Under /clip the same page shows the clips from web pages, in the extension's side panel.
const CLIP = location.pathname.startsWith("/clip");
const API = CLIP ? "/clip/api" : "/api";
if (CLIP) {
  document.body.classList.add("clip");
  $("no-cards").textContent = "No cards yet. On a web page, select a word or some text, right-click it, and choose " +
    "Make a card from this: what you selected is the term, its whole sentences the passage.";
}
const HINT = CLIP
  ? "Select a word or a sentence on a page, right-click it, and choose Make a card from this."
  : "Click a word for a card; click again to remove it. Drag over words: they are the term, their whole sentences " +
    "the passage. A blue line: you already have a card (point at it).";

let state = { paragraphs: [], cards: [], count_text: "0 cards" };
let term = null;       // the term dragged over, while its definition is still to be marked
let editing = null;    // the id of the card being edited
let draft = null;      // what is typed in Edit, kept while the card is drawn again: { id, front, back }
let lastPick = null;   // the last word click or definition sent, so "Make it anyway" can send it again
let shownPdf = null;   // the version of the PDF whose pages are drawn, so its pictures are not drawn again

function element(tag, className, text) {
  const made = document.createElement(tag);
  if (className) made.className = className;
  if (text !== undefined) made.textContent = text;
  return made;
}

function say(message, warn) {
  const status = $("status");
  status.replaceChildren();
  status.classList.remove("earlier");
  status.classList.toggle("warn", Boolean(warn));
  if (term !== null && !warn) {
    status.append("Term: ", element("span", "term", term), " Now drag over its definition.");
    const cancel = element("button", "small", "Cancel (Esc)");
    cancel.addEventListener("click", () => { term = null; say(""); });
    status.append(cancel);
    return;
  }
  status.textContent = message || HINT;
}

function showEarlier(data) {
  const status = $("status");
  status.replaceChildren();
  status.classList.remove("warn");
  status.classList.add("earlier");
  const card = element("div", "earlier-card");
  const front = element("div", "front");
  front.innerHTML = data.earlier.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = data.earlier.back_html;
  card.append(front, back);
  const skip = element("button", "small", "Skip");
  skip.addEventListener("click", () => say("Skipped: no new card."));
  const anyway = element("button", "main small", "Make it anyway");
  const request = lastPick;
  anyway.addEventListener("click", () => call("POST", request.url, { ...request.body, anyway: true }));
  const buttons = element("div", "buttons");
  buttons.append(skip, anyway);
  status.append(element("span", "", data.message), card, buttons);
}

function pick(url, body) {
  lastPick = { url, body };
  return call("POST", url, body);
}

async function call(method, url, body) {
  let response, data;
  try {
    response = await fetch(url, {
      method,
      headers: body === undefined || body instanceof FormData ? {} : { "Content-Type": "application/json" },
      body: body === undefined || body instanceof FormData ? body : JSON.stringify(body),
    });
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return null;
  }
  try {
    data = await response.json();
  } catch (error) {
    // The app answered, but not with JSON: an error inside the app, not a lost connection.
    say("The app ran into an error (" + response.status + "). The terminal running `sentmine` shows what happened.", true);
    return null;
  }
  if (!response.ok) {
    say(data.error || "Something went wrong.", true);
    return null;
  }
  return use(data);
}

function use(data) {   // show what the app answered
  state = data;
  draw();
  if (data.result === "earlier") {
    showEarlier(data);
  } else {
    say(data.message, data.result === "duplicate" || data.result === "warning");
  }
  return data;
}

function drawText() {
  const text = $("text");
  if (state.pdf) {
    drawPages(text);
    return;
  }
  shownPdf = null;
  text.classList.remove("pdf");
  text.replaceChildren();
  text.classList.toggle("empty", state.paragraphs.length === 0);
  if (state.paragraphs.length === 0) {
    text.textContent = CLIP
      ? "No clips yet. On a web page, select a word, a sentence or a definition (roughly is enough), right-click it, and choose Make a card from this."
      : "No text yet.";
    return;
  }
  state.paragraphs.forEach((paragraph, number) => {
    const p = element("p");
    paragraph.forEach((sentence, index) => {
      if (index > 0) p.append(" ");
      for (const piece of sentence.pieces) {
        if (piece.word === undefined) {
          p.append(piece.text);
          continue;
        }
        const word = element("span", piece.picked ? "w picked" : piece.known ? "w known" : "w", piece.text);
        if (piece.known) word.dataset.known = piece.known;
        word.dataset.sentence = sentence.sentence;
        word.dataset.word = piece.word;
        p.append(word);
      }
    });
    if (!state.clips) {
      text.append(p);
      return;
    }
    // a clip: what to do with it, and a way to take it away
    const head = element("div", "clip-head");
    head.append(element("span", "", "Click a word, or drag over the term"));
    const remove = element("button", "small", "Remove");
    remove.setAttribute("aria-label", "Remove this clip");
    remove.addEventListener("click", () => call("DELETE", API + "/clips/" + number));
    head.append(remove);
    const clip = element("div", "clip");
    clip.append(head, p);
    text.append(clip);
  });
}

// A PDF is drawn as its own pages: a picture of each page with a box over each word, made
// when the page comes near the screen. The boxes are words like those of a pasted text.
const pageWatcher = new IntersectionObserver((seen) => {
  for (const entry of seen) {
    if (entry.isIntersecting) {
      pageWatcher.unobserve(entry.target);
      fillPage(entry.target);
    }
  }
}, { rootMargin: "1200px 0px" });

function drawPages(text) {
  if (shownPdf !== state.pdf.version) {
    shownPdf = state.pdf.version;
    pageWatcher.disconnect();
    text.classList.remove("empty");
    text.classList.add("pdf");
    text.replaceChildren();
    state.pdf.sizes.forEach(([width, height], number) => {
      const page = element("div", "pdf-page");
      page.style.aspectRatio = width + " / " + height;
      page.dataset.page = number;
      const picture = element("img");
      picture.alt = "Page " + (number + 1);
      picture.loading = "lazy";
      picture.src = "/api/pages/" + number + ".png?v=" + shownPdf;
      page.append(picture, element("span", "page-number", String(number + 1)));
      text.append(page);
      pageWatcher.observe(page);
    });
  }
  markPicked();
}

async function fillPage(page) {
  const version = shownPdf;
  let boxes, links;
  try {
    const response = await fetch("/api/pages/" + page.dataset.page + "/words?v=" + version);
    const answer = await response.json();
    boxes = answer.boxes;
    links = answer.links || [];
  } catch (error) {
    return;   // the page stays a picture; its words cannot be picked
  }
  if (version !== shownPdf || !boxes) return;   // another text was read meanwhile
  for (const link of links) drawLink(page, link);
  for (const [sentence, word, left, top, width, height] of boxes) {
    const box = element("span", "w", wordText(sentence, word));
    box.dataset.sentence = sentence;
    box.dataset.word = word;
    box.style.cssText = "left:" + left * 100 + "%;top:" + top * 100 + "%;width:" + width * 100 + "%;height:" +
      height * 100 + "%;font-size:" + height * 85 + "cqh";
    page.append(box);
  }
  markPicked();
}

// The PDF's own links: inside the PDF, to the page they point at; to a website, in a new tab.
function drawLink(page, link) {
  const [left, top, width, height] = link.box;
  const anchor = element("a", "pdf-link");
  Object.assign(anchor.style, { left: left * 100 + "%", top: top * 100 + "%", width: width * 100 + "%", height: height * 100 + "%" });
  anchor.tabIndex = -1;   // the page bar and the words are the keyboard's way through; 100 links would be 100 stops
  if (link.url) {
    anchor.href = link.url;
    anchor.target = "_blank";
    anchor.rel = "noopener noreferrer";
    anchor.title = link.url;
  } else {
    anchor.href = "#page-" + (link.page + 1);
    anchor.title = "Go to page " + (link.page + 1);
    anchor.addEventListener("click", (event) => { event.preventDefault(); goToPage(link.page, link.y || 0); });
  }
  page.append(anchor);
}

// The page bar: which page is in view, a page to jump to, and the PDF's contents when it has bookmarks.
function goToPage(number, within = 0) {
  const pages = document.querySelectorAll(".pdf-page");
  const page = pages[Math.min(Math.max(number, 0), pages.length - 1)];
  if (!page) return;
  const r = page.getBoundingClientRect();
  window.scrollTo(0, window.scrollY + r.top + within * r.height - textTop() - 8);
}

function drawPdfNav() {
  const nav = $("pdf-nav");
  nav.hidden = !state.pdf || CLIP;
  if (nav.hidden) return;
  $("page-count").textContent = state.pdf.sizes.length;
  $("page-number").max = state.pdf.sizes.length;
  const outline = state.pdf.outline || [];
  $("contents").hidden = outline.length === 0;
  $("contents-list").replaceChildren(...outline.map((item) => {
    const row = element("li");
    const go = element("button", "", item.title);
    go.style.paddingLeft = 8 + item.level * 16 + "px";
    go.addEventListener("click", () => { $("contents").open = false; goToPage(item.page); });
    row.append(go);
    return row;
  }));
}

function pageInView() {
  const top = textTop();
  const page = [...document.querySelectorAll(".pdf-page")].find((one) => one.getBoundingClientRect().bottom > top + 40);
  return page ? Number(page.dataset.page) : 0;
}

$("page-number").addEventListener("change", () => goToPage(Number($("page-number").value) - 1));
window.addEventListener("scroll", () => {
  if (!state.pdf || document.activeElement === $("page-number")) return;
  $("page-number").value = pageInView() + 1;
}, { passive: true });

function wordText(sentence, word) {
  for (const paragraph of state.paragraphs) {
    for (const drawn of paragraph) {
      if (drawn.sentence !== sentence) continue;
      const piece = drawn.pieces.find((one) => one.word === word);
      return piece ? piece.text : "";
    }
  }
  return "";
}

function markPicked() {   // picked words, and words that already have cards, on a PDF's pages
  const picked = new Set();
  const known = new Map();
  for (const paragraph of state.paragraphs) {
    for (const drawn of paragraph) {
      for (const piece of drawn.pieces) {
        if (piece.picked) picked.add(drawn.sentence + ":" + piece.word);
        if (piece.known) known.set(drawn.sentence + ":" + piece.word, piece.known);
      }
    }
  }
  for (const box of $("text").querySelectorAll(".pdf-page .w")) {
    const place = box.dataset.sentence + ":" + box.dataset.word;
    box.classList.toggle("picked", picked.has(place));
    box.classList.toggle("known", known.has(place));
    if (known.has(place)) box.dataset.known = known.get(place);
    else delete box.dataset.known;
  }
  for (const page of $("text").querySelectorAll(".pdf-page")) markKnownLines(page);
}

// On a PDF page: a dot in the margin beside each line with a word you have a card for, and their count.
function markKnownLines(page) {
  page.querySelectorAll(".known-dot, .known-count").forEach((mark) => mark.remove());
  const known = [...page.querySelectorAll(".w.known")];
  if (known.length === 0) return;
  const textLeft = Math.min(...[...page.querySelectorAll(".w")].map((box) => parseFloat(box.style.left)));
  const lines = new Set();
  for (const box of known) {
    const middle = Math.round(parseFloat(box.style.top) + parseFloat(box.style.height) / 2);
    if (lines.has(middle)) continue;
    lines.add(middle);
    const dot = element("span", "known-dot");
    dot.setAttribute("aria-hidden", "true");
    dot.style.top = middle + "%";
    dot.style.left = Math.max(textLeft - 2.2, 1) + "%";
    page.append(dot);
  }
  page.append(element("span", "known-count",
    known.length === 1 ? "1 word you have a card for" : known.length + " words you have cards for"));
}

// Pointing at a word that already has a card shows that card under the word.
function showKnownCard(word) {
  const card = state.known_cards && state.known_cards[word.dataset.known];
  const shown = $("known-card");
  if (!card) return;
  const front = element("div", "front");
  front.innerHTML = card.front_html;   // escaped by the server; only <b> and <br> are real tags
  const back = element("div", "back");
  back.innerHTML = card.back_html;
  const made = element("div", "made", "Your card from " + card.date);
  if (card.met_again) made.append(" · ", element("span", "met", card.met_again));
  shown.replaceChildren(made, front, back);
  shown.hidden = false;
  const r = word.getBoundingClientRect();
  const left = Math.max(8, Math.min(r.left, window.innerWidth - shown.offsetWidth - 8));
  const below = r.bottom + 8 + shown.offsetHeight < window.innerHeight;
  shown.style.left = left + "px";
  shown.style.top = (below ? r.bottom + 8 : r.top - 8 - shown.offsetHeight) + "px";
}

$("text").addEventListener("mouseover", (event) => {
  if (event.target.matches(".w.known") && !pageDrag) showKnownCard(event.target);
});
$("text").addEventListener("mouseout", (event) => {
  if (event.target.matches(".w.known")) $("known-card").hidden = true;
});
window.addEventListener("scroll", () => { $("known-card").hidden = true; }, { passive: true });

const order = (box) => [Number(box.dataset.sentence), Number(box.dataset.word)];
const before = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);

// The text from word `first` to word `last` (each [sentence, word]), with its spaces and
// paragraph breaks and the punctuation right after the last word. On a PDF's pages the boxes
// hold single words, so a passage is taken from the words of the text, not from the page.
function textBetween(first, last) {
  const paragraphs = [];
  let inside = false, done = false;
  for (const paragraph of state.paragraphs) {
    const sentences = [];
    for (const drawn of paragraph) {
      let part = "";
      for (const piece of drawn.pieces) {
        if (done) {
          if (piece.word === undefined) part += piece.text.match(/^[^\s\p{L}\p{N}]*/u)[0];   // the full stop right after the last word
          break;
        }
        const at = piece.word === undefined ? null : [drawn.sentence, piece.word];
        if (at && at[0] === first[0] && at[1] === first[1]) inside = true;
        if (inside) part += piece.text;
        if (at && at[0] === last[0] && at[1] === last[1]) { inside = false; done = true; }
      }
      if (part) sentences.push(part);
      if (done && !inside) break;
    }
    if (sentences.length) paragraphs.push(sentences.join(" "));
    if (done) break;
  }
  return paragraphs.join("\n\n").trim();
}

// On a PDF's pages sentmine drags by itself instead of using the browser's selection, which
// over small separate boxes is easily taken for a click or selects nothing in the gaps between
// words. A press that moves DRAG_PIXELS or more is a drag; it runs from the word nearest the
// press to the word nearest the pointer, and those words are marked while it goes on.
const DRAG_PIXELS = 5;
const EDGE_PIXELS = 48;   // dragging this near the top or bottom of the window scrolls it
let pageDrag = null;      // { from, to, x, y, lastX, lastY, moved, scroller }

function nearestBox(x, y) {
  const under = document.elementFromPoint(x, y);
  if (!under) return null;
  if (under.matches(".pdf-page .w")) return under;
  const page = under.closest(".pdf-page");
  if (!page) return null;
  let best = null, bestScore = Infinity;
  for (const box of page.querySelectorAll(".w")) {
    const r = box.getBoundingClientRect();
    const dx = x < r.left ? r.left - x : x > r.right ? x - r.right : 0;
    const dy = y < r.top ? r.top - y : y > r.bottom ? y - r.bottom : 0;
    const score = 4 * dy + dx;   // the same line counts for more than the nearest column
    if (score < bestScore) { best = box; bestScore = score; }
  }
  return best;
}

function draggedWords(drag) {
  const from = order(drag.from), to = order(drag.to);
  return before(to, from) ? [to, from] : [from, to];
}

function followDrag() {
  const to = nearestBox(pageDrag.lastX, pageDrag.lastY);
  if (to) pageDrag.to = to;
  const [first, last] = draggedWords(pageDrag);
  for (const box of $("text").querySelectorAll(".pdf-page .w")) {
    const at = order(box);
    box.classList.toggle("dragged", !before(at, first) && !before(last, at));
  }
}

function scrollWhileDragging() {
  const top = $("status").getBoundingClientRect().bottom;
  if (pageDrag.lastY > window.innerHeight - EDGE_PIXELS) window.scrollBy(0, 24);
  else if (pageDrag.lastY < top + EDGE_PIXELS) window.scrollBy(0, -24);
  else return;
  followDrag();
}

$("text").addEventListener("mousedown", (event) => {
  if (event.button !== 0 || event.detail >= 2 || !state.pdf) return;
  if (event.target.closest && event.target.closest(".pdf-link")) return;   // the link takes the click
  const from = nearestBox(event.clientX, event.clientY);
  if (!from) return;
  event.preventDefault();   // no browser selection: sentmine marks the words itself
  $("known-card").hidden = true;
  pageDrag = { from, to: from, x: event.clientX, y: event.clientY, lastX: event.clientX, lastY: event.clientY, moved: false, scroller: null };
});

document.addEventListener("mousemove", (event) => {
  if (!pageDrag) return;
  pageDrag.lastX = event.clientX;
  pageDrag.lastY = event.clientY;
  if (!pageDrag.moved) {
    if (Math.hypot(event.clientX - pageDrag.x, event.clientY - pageDrag.y) < DRAG_PIXELS) return;
    pageDrag.moved = true;
    pageDrag.scroller = setInterval(scrollWhileDragging, 40);
  }
  followDrag();
});

function endPageDrag(event) {
  const drag = pageDrag;
  pageDrag = null;
  clearInterval(drag.scroller);
  for (const box of $("text").querySelectorAll(".pdf-page .w.dragged")) box.classList.remove("dragged");
  if (drag.moved) {
    const [first, last] = draggedWords(drag);
    chose(textBetween(first, last), first[0], last[0]);
  } else if (event.target === drag.from) {
    pickWord(drag.from);   // a press and release on a word without moving: a click
  }
}

async function busy(button, label, work) {
  const idle = button.textContent;
  button.disabled = true;
  button.textContent = label;
  try {
    await work();
  } finally {
    button.disabled = false;
    button.textContent = idle;
  }
}

function drawCard(card) {
  const box = element("div", "card");
  const kind = element("span", "kind",
    card.cloze ? "Cloze" : "Term → passage");

  if (editing === card.id) {
    if (!draft || draft.id !== card.id) {   // the card as it was, so Cancel can put it back
      draft = { id: card.id, front: card.front, back: card.back, original: { front: card.front, back: card.back } };
    }
    // a picture that arrived while editing (pasted, cut from the page, sent from a web page) takes the place
    // of the cursor's mark, on either side, or goes to the end of the back. The picture just added goes to the mark
    // even when the card has it already (the same screenshot pasted again, into the Term this time).
    let placed = null;   // the picture put at the cursor: the cursor goes on after it
    const just = state.added_picture;
    if (just && (card.pictures || {})[just]) {
      const side = draft.front.includes(CURSOR) ? "front" : draft.back.includes(CURSOR) ? "back" : null;
      if (side) { draft[side] = draft[side].replace(AT_CURSOR, "\n[[picture:" + just + "]]\n"); placed = { side, name: just }; }
    }
    for (const name of Object.keys(card.pictures || {})) {
      const mark = "[[picture:" + name + "]]";
      // one already handled in this edit (put in, then deleted or undone) does not come back
      if (name in editPictures || draft.front.includes(mark) || draft.back.includes(mark)) continue;
      const side = draft.front.includes(CURSOR) ? "front" : "back";
      const place = "\n" + mark + "\n";
      if (draft[side].includes(CURSOR)) placed = { side, name };
      draft[side] = draft[side].includes(CURSOR) ? draft[side].replace(AT_CURSOR, place) : draft[side] + place;
    }
    for (const side of ["front", "back"]) draft[side] = tidyDoc(draft[side].split(CURSOR).join(""));
    // Each side is a small document: text, and pictures where the reader put them.
    const names = ["Term", "Passage"];
    editPictures = { ...editPictures, ...(card.pictures || {}) };
    const front = docEditor("front", names[0], card);
    const back = docEditor("back", names[1], card);
    if (placed) {   // keep the cursor's place: just after the picture that took it
      const image = [...(placed.side === "front" ? front : back).querySelectorAll("img")].find((one) => one.dataset.name === placed.name);
      if (image) {
        const after = document.createRange();
        after.setStartAfter(image);
        after.collapse(true);
        lastCaret = { editor: placed.side === "front" ? front : back, range: after };
      }
    }
    const save = element("button", "main small", "Save");
    save.addEventListener("click", async () => {
      const clean = (editor) => docText(editor).split(CURSOR).join("");   // a mark left by a picture that never came
      const done = await call("PUT", API + "/cards/" + card.id, { front: clean(front), back: clean(back) });
      if (done) closeEditing();
    });
    const cancel = element("button", "small", "Cancel");
    cancel.addEventListener("click", async () => {
      const now = state.cards.find((one) => one.id === card.id);
      const { original } = draft;   // a picture added meanwhile is on the card already: put the card back as it was
      if (now && (now.front !== original.front || now.back !== original.back)) await call("PUT", API + "/cards/" + card.id, original);
      closeEditing();
    });
    const undo = element("button", "small undo-button", "Undo");
    undo.title = "Take back the last thing put in, deleted or typed (Ctrl+Z)";
    undo.addEventListener("click", () => stepBack(undoSteps, redoSteps));
    const redo = element("button", "small redo-button", "Redo");
    redo.title = "Put it back (Ctrl+Y)";
    redo.addEventListener("click", () => stepBack(redoSteps, undoSteps));
    const buttons = element("div", "buttons");
    buttons.append(kind, save, cancel, undo, redo);
    box.classList.add("editing-card");
    const mark = element("span", "caret-mark");
    mark.hidden = true;
    mark.title = "The next sentence or picture goes here";
    box.append(element("span", "side-name", names[0]), front, element("span", "side-name", names[1]), back,
      element("div", "paste-hint", editHint()), buttons, mark);
    return box;
  }

  const front = element("div", "front");
  front.innerHTML = card.front_html;   // escaped by the server; only <b>, <br> and its own pictures are real tags
  const back = element("div", "back");
  back.innerHTML = card.back_html;
  if (card.earlier) box.append(element("div", "made-before", "Made before, on " + card.earlier + "."));
  const edit = element("button", "small", "Edit");
  edit.addEventListener("click", () => startEditing(card.id));
  const remove = element("button", "small", "Delete");
  remove.addEventListener("click", () => call("DELETE", API + "/cards/" + card.id));
  const buttons = element("div", "buttons");
  buttons.append(kind, edit, remove);
  if (card.cloze || card.can_cloze) {
    const other = element("button", "small", card.cloze ? "Make it term → passage" : "Make it cloze");
    other.addEventListener("click", () => call("PUT", API + "/cards/" + card.id + "/cloze", { cloze: !card.cloze }));
    buttons.append(other);
  }
  if (card.kind === "word" && state.can_suggest) {
    const suggest = element("button", "small", "Suggest meaning");
    suggest.addEventListener("click", async () => {
      suggest.disabled = true;
      suggest.textContent = "Asking…";
      const done = await call("POST", API + "/cards/" + card.id + "/meaning");
      if (!done) {   // the message says why; the card has not changed
        suggest.disabled = false;
        suggest.textContent = "Suggest meaning";
      }
    });
    buttons.append(suggest);
  }
  if (card.cloze) box.classList.add("is-cloze");
  box.append(front, back);
  if (card.origin) box.append(element("div", "origin", "From " + card.origin));   // under the passage: where it came from
  box.append(buttons);
  return box;
}

// The back of a card as a small document. Its text holds each picture's place as [[picture:name]] on a line
// of its own; the editor shows the picture there, and reads the places back from what the reader arranged.
const CURSOR = "\uFFFC";   // marks where the cursor was while a pasted picture is on its way
const AT_CURSOR = /\n?\uFFFC\n?/;   // with the line breaks beside it, so no empty line is left
const PLACE = /\n?\[\[picture:(sentmine-[0-9a-f]{16}\.png)\]\]\n?/g;

// One side of the card being edited, as an editable document; `side` is "front" or "back".
function docEditor(side, name, card) {
  const editor = element("div", "doc-editor " + side + "-editor");
  editor.contentEditable = "plaintext-only";
  if (editor.contentEditable !== "plaintext-only") editor.contentEditable = "true";   // an older browser
  editor.dataset.side = side;
  editor.setAttribute("role", "textbox");
  editor.setAttribute("aria-multiline", "true");
  editor.setAttribute("aria-label", name + ": text and pictures");
  fillDoc(editor, draft[side], card.pictures || {});
  editor.addEventListener("beforeinput", () => {   // typing: one undo step per run of typing
    if (Date.now() - lastTyping > 1000) remember();
    lastTyping = Date.now();
  });
  editor.addEventListener("input", () => { draft[side] = docText(editor); });
  editor.addEventListener("keydown", (event) => {   // the browser deletes letters; a picture is deleted here
    if (isPictureDelete(editor, event.key)) remember();
    if (deletePicture(editor, event.key)) {
      event.preventDefault();
      draft[side] = docText(editor);
    }
  });
  editor.addEventListener("click", (event) => {   // a click on a picture selects it, to delete it
    if (event.target.nodeName !== "IMG") return;
    const range = document.createRange();
    range.selectNode(event.target);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  });
  return editor;
}

function tidyDoc(text) {
  return text.replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
}

function fillDoc(editor, text, pictures) {
  editor.replaceChildren();
  let at = 0;
  for (const found of text.matchAll(PLACE)) {
    if (found.index > at) editor.append(text.slice(at, found.index));
    if (pictures[found[1]]) {
      const image = element("img");
      image.src = pictures[found[1]];
      image.dataset.name = found[1];
      image.alt = "A picture on this card";
      editor.append(image);
    }
    at = found.index + found[0].length;
  }
  if (at < text.length) editor.append(text.slice(at));
}

// Backspace or Delete beside a picture, or with a picture selected, takes the picture out; true if it did.
function deletePicture(editor, key) {
  if (key !== "Backspace" && key !== "Delete") return false;
  const selection = window.getSelection();
  if (!selection.rangeCount || !editor.contains(selection.anchorNode)) return false;
  const range = selection.getRangeAt(0);
  if (!range.collapsed) {
    if (range.cloneContents().querySelector("img") === null) return false;   // only text: the browser's job
    range.deleteContents();
    return true;
  }
  const { startContainer: node, startOffset: offset } = range;
  let beside = null;
  if (node === editor) {
    beside = editor.childNodes[key === "Backspace" ? offset - 1 : offset] || null;
  } else if (node.nodeType === Node.TEXT_NODE && node.parentNode === editor) {
    if (key === "Backspace" && offset === 0) beside = node.previousSibling;
    if (key === "Delete" && offset === node.textContent.length) beside = node.nextSibling;
  }
  if (!beside || beside.nodeName !== "IMG") return false;
  beside.remove();
  return true;
}

function docText(editor) {
  let text = "";
  const read = (node) => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        text += child.textContent;
      } else if (child.nodeName === "BR") {
        text += "\n";
      } else if (child.nodeName === "IMG") {
        if (child.dataset.name) text += "\n[[picture:" + child.dataset.name + "]]\n";
      } else {   // a block the browser made for a new line
        if (text && !text.endsWith("\n")) text += "\n";
        read(child);
        if (!text.endsWith("\n")) text += "\n";
      }
    }
  };
  read(editor);
  return tidyDoc(text);
}

// Paste a picture (Ctrl+V): a copied image or a screenshot. While a card is edited it goes into its back where
// the cursor is; otherwise on the card last made or edited, at the end. Pasted text is left alone.
const WIDEST_PICTURE = 1600;   // pixels; Anki shows it no wider

async function pastedPng(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, WIDEST_PICTURE / bitmap.width);
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/png").split(",")[1];
}

document.addEventListener("paste", async (event) => {
  const item = [...((event.clipboardData && event.clipboardData.items) || [])].find((one) => one.kind === "file" && one.type.startsWith("image/"));
  if (!item) return;   // text: the browser pastes it as usual
  event.preventDefault();
  const card = editing !== null ? editing : state.chosen_card;
  if (card === null || card === undefined) {
    say("Make a card first; then paste the picture.", true);
    return;
  }
  const selection = window.getSelection();
  const editor = editing !== null && selection.rangeCount
    ? [...document.querySelectorAll(".doc-editor")].find((one) => one.contains(selection.anchorNode)) : null;
  if (editor && draft) {
    const range = selection.getRangeAt(0);   // remember where the cursor is: the picture goes there
    remember();
    range.deleteContents();
    range.insertNode(document.createTextNode(CURSOR));
    draft[editor.dataset.side] = docText(editor);
  } else {
    markCursor();   // pasted with the focus elsewhere: where the cursor last was in the card
  }
  let png;
  try {
    png = await pastedPng(item.getAsFile());
  } catch (error) {
    png = null;
  }
  const added = png && await call("POST", API + "/cards/" + card + "/pictures", { png });
  if (!added) {
    if (png === null) say("That picture could not be read.", true);
    if (draft) { draft.front = draft.front.split(CURSOR).join(""); draft.back = draft.back.split(CURSOR).join(""); draw(); }
  }
});

// Where the cursor last was in the card being edited, Term or Passage: a picture cut from the PDF page or sent
// from a web page goes there, though the click on a button or another window took the cursor away.
let lastCaret = null;   // { editor, range }
document.addEventListener("selectionchange", () => {
  const selection = window.getSelection();
  if (editing === null || !selection.rangeCount) return;
  const editor = [...document.querySelectorAll(".doc-editor")].find((one) => one.contains(selection.anchorNode));
  if (editor) lastCaret = { editor, range: selection.getRangeAt(0).cloneRange() };
});

function caretInCard() {   // the last place of the cursor, while it is still in the editor on the page
  if (editing === null || !draft || !lastCaret || !document.contains(lastCaret.editor)) return null;
  return lastCaret.editor.contains(lastCaret.range.endContainer) ? lastCaret : null;
}

function markCursor() {   // the cursor's mark at its last place; false when there is none
  const caret = caretInCard();
  if (!caret) return false;
  remember();
  const range = caret.range.cloneRange();
  range.collapse(false);
  range.insertNode(document.createTextNode(CURSOR));
  draft[caret.editor.dataset.side] = docText(caret.editor);
  return true;
}

function dropCursor() {   // no picture came: the mark goes, from the editors and the draft
  for (const editor of document.querySelectorAll(".doc-editor")) {
    for (const node of [...editor.childNodes]) {
      if (node.nodeType === Node.TEXT_NODE && node.textContent.includes(CURSOR)) node.textContent = node.textContent.split(CURSOR).join("");
    }
  }
  if (draft) { draft.front = draft.front.split(CURSOR).join(""); draft.back = draft.back.split(CURSOR).join(""); }
}

// A picture from the PDF page: while a card is open in Edit, a drag on a page draws a box around a formula or graph;
// that part of the page, drawn from the PDF itself, goes in where the card's cursor is. A click instead of a drag
// puts in the sentence clicked. Esc cancels a box.
let boxFor = null;     // the card the box is for, while one is being drawn
let boxing = null;     // { page, x, y, mark } while the mouse is down

function stopBox(message) {
  boxFor = null;
  if (boxing) boxing.mark.remove();
  boxing = null;
  document.body.classList.remove("boxing");
  if (message !== undefined) say(message);
}

function pageFraction(page, event) {
  const r = page.getBoundingClientRect();
  return [Math.min(Math.max((event.clientX - r.left) / r.width, 0), 1), Math.min(Math.max((event.clientY - r.top) / r.height, 0), 1)];
}

// Capture phase, so that while a box is drawn the clicks and drags on the words do nothing else.
document.addEventListener("mousedown", (event) => {
  if (event.button !== 0 || editing === null || !state.pdf || CLIP) return;
  const page = event.target.closest && event.target.closest(".pdf-page");
  if (!page || event.target.closest("a")) return;   // a link on the page still works
  boxFor = editing;
  event.preventDefault();
  event.stopImmediatePropagation();
  const [x, y] = pageFraction(page, event);
  const mark = element("div", "box-drawn");
  page.append(mark);
  boxing = { page, x, y, mark };
}, true);

document.addEventListener("mousemove", (event) => {
  if (!boxing) return;
  event.stopImmediatePropagation();
  const [x, y] = pageFraction(boxing.page, event);
  const [left, top] = [Math.min(x, boxing.x), Math.min(y, boxing.y)];
  Object.assign(boxing.mark.style, { left: left * 100 + "%", top: top * 100 + "%",
    width: Math.abs(x - boxing.x) * 100 + "%", height: Math.abs(y - boxing.y) * 100 + "%" });
}, true);

document.addEventListener("mouseup", async (event) => {
  if (!boxing) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const [x, y] = pageFraction(boxing.page, event);
  const box = [Math.min(x, boxing.x), Math.min(y, boxing.y), Math.abs(x - boxing.x), Math.abs(y - boxing.y)];
  const page = Number(boxing.page.dataset.page);
  const card = boxFor;
  stopBox();
  if (box[2] < 0.004 && box[3] < 0.004) {   // a click, not a box: the sentence of the word clicked
    const word = document.elementsFromPoint(event.clientX, event.clientY).find((one) => one.classList && one.classList.contains("w"));
    if (word) putIn(Number(word.dataset.sentence), Number(word.dataset.sentence), word.textContent);
    return;
  }
  markCursor();   // the picture goes where the cursor was
  if (!await call("POST", "/api/cards/" + card + "/pictures", { page, box })) dropCursor();
}, true);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && boxFor !== null) {
    dropCursor();
    stopBox("No picture added.");
  }
});

function draw() {
  drawPdfNav();
  const hadKeys = keyPlace !== null && $("text").contains(document.activeElement);
  drawText();
  if (hadKeys) {   // pasted text is drawn again after each card: keep the keyboard on its word
    const again = wordAt(keyPlace);
    if (again) focusWord(again, false);
  }
  $("count").textContent = state.count_text;
  $("cards").replaceChildren(...state.cards.map(drawCard));
  $("no-cards").hidden = state.cards.length > 0;
  document.body.classList.toggle("editing-pdf", editing !== null && !!state.pdf && !CLIP);
  showCaretMark();
  showUndo();
}

// One handler tells a click from a drag. It listens on the document because a drag may end
// outside the text, and on mouseup because a click handler would come after the drag's
// selection is cleared, and so would take every drag inside one word for a click.
document.addEventListener("mouseup", (event) => {
  if (event.button !== 0) return;
  if (pageDrag) {
    endPageDrag(event);
    return;
  }
  const selection = window.getSelection();
  const selected = selection.toString().trim();
  const inText = selected && $("text").contains(selection.anchorNode);
  if (event.detail >= 2) {   // a double- or triple-click selects a word or paragraph; its first click counted
    if (inText) selection.removeAllRanges();
    return;
  }
  if (inText) {
    const clipped = CLIP && term === null ? clipOf(selection.anchorNode) : null;
    const over = [...$("text").querySelectorAll(".w")].filter((word) => selection.containsNode(word, true));
    selection.removeAllRanges();
    if (editing !== null) {
      if (over.length) putIn(Number(over[0].dataset.sentence), Number(over[over.length - 1].dataset.sentence), termOf(selected));
    } else if (clipped) {
      pick(API + "/definition", { term: termOf(selected), passage: clipped.textContent.trim() });
    } else if (over.length) {
      chose(selected, Number(over[0].dataset.sentence), Number(over[over.length - 1].dataset.sentence));
    }
    return;
  }
  if (selected || !event.target.classList.contains("w") || !$("text").contains(event.target)) return;
  pickWord(event.target);
});

// a term keeps no full stop, comma or colon after it: "Simpson's reversal:" would hide the colon in a cloze card
function termOf(selected) {
  return selected.replace(/\s+/g, " ").replace(/[.,;:!?]+$/, "") || selected;
}

function clipOf(node) {   // the clip a drag was in: a drag over a term makes its card, with the clip as the passage
  const element = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
  return element ? element.closest("#text .clip p") : null;
}

// A drag (or the marked words, from the keyboard) makes its card at once: what was dragged is the term, the whole
// sentences it touches the passage. Either can be changed in Edit.

function chose(selected, first, last) {
  if (!selected) return;
  if (editing !== null) {
    putIn(first, last, termOf(selected));
    return;
  }
  pick(API + "/definition", { term: termOf(selected), sentence: first, last });
}

function pickWord(box) {
  term = null;
  if (editing !== null) {   // in Edit, a click is for the sentence, put in at the cursor, not a card for the word
    putIn(Number(box.dataset.sentence), Number(box.dataset.sentence), box.textContent);
    return;
  }
  pick(API + "/word", { sentence: Number(box.dataset.sentence), word: Number(box.dataset.word) });
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && term !== null) {
    term = null;
    say("");
  }
});

// The keyboard way to make cards: Tab into the text, the arrow keys move from word to word, Enter makes a
// card from the word (and again removes it); Shift and the arrow keys mark words, as a drag does, and Enter
// uses them as the term or its definition. A word you already have a card for shows that card.
let keyPlace = null;   // "sentence:word" of the word the keyboard is on
let keyAnchor = null;  // where a Shift-marking started

const placeOf = (word) => word.dataset.sentence + ":" + word.dataset.word;
const textWords = () => [...$("text").querySelectorAll(".w")];
const wordAt = (place) => place && textWords().find((word) => placeOf(word) === place);

function focusWord(word, scroll = true) {
  word.tabIndex = -1;
  word.focus({ preventScroll: true });
  if (scroll) word.scrollIntoView({ block: "nearest" });
  keyPlace = placeOf(word);
  $("known-card").hidden = true;
  if (word.classList.contains("known")) {
    word.setAttribute("aria-describedby", "known-card");
    requestAnimationFrame(() => requestAnimationFrame(() => {   // after the scroll, which hides the card
      if (document.activeElement === word) showKnownCard(word);
    }));
  }
}

function firstWordInView() {
  const top = textTop();
  return textWords().find((word) => {
    const r = word.getBoundingClientRect();
    return r.height > 0 && r.top >= top && r.bottom <= window.innerHeight;
  });
}

function marked() {
  return textWords().filter((word) => word.classList.contains("dragged"));
}

function clearMarks() {
  for (const word of marked()) word.classList.remove("dragged");
  keyAnchor = null;
}

$("text").addEventListener("focus", (event) => {
  // only when the keyboard arrives: a click beside the words must not move anything during a drag
  if (event.target !== $("text") || !$("text").matches(":focus-visible")) return;
  const word = wordAt(keyPlace) || firstWordInView() || textWords()[0];
  if (word) focusWord(word);
});

$("text").addEventListener("focusout", (event) => {
  if (event.target.classList && event.target.classList.contains("known")) $("known-card").hidden = true;
});

$("text").addEventListener("keydown", (event) => {
  const words = textWords();
  const at = words.indexOf(document.activeElement);
  if (at < 0) return;
  if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
    event.preventDefault();
    const to = Math.max(0, Math.min(words.length - 1, at + (event.key === "ArrowRight" ? 1 : -1)));
    if (event.shiftKey) {
      if (keyAnchor === null) keyAnchor = at;
      const [from, until] = [Math.min(keyAnchor, to), Math.max(keyAnchor, to)];
      words.forEach((word, index) => word.classList.toggle("dragged", index >= from && index <= until));
    } else {
      clearMarks();
    }
    focusWord(words[to]);
    return;
  }
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    const range = marked();
    if (range.length === 0) {
      pickWord(words[at]);
      return;
    }
    const selected = range.map((word) => word.textContent).join(" ");
    const clipped = CLIP && term === null ? clipOf(range[0]) : null;
    clearMarks();
    if (clipped) pick(API + "/definition", { term: termOf(selected), passage: clipped.textContent.trim() });
    else chose(selected, Number(range[0].dataset.sentence), Number(range[range.length - 1].dataset.sentence));
    return;
  }
  if (event.key === "Escape" && marked().length > 0) clearMarks();
});

// One deck, two views: Read and the side panel each ask now and then whether the other changed the deck,
// and draw it again if so, unless the reader is in the middle of something here.
async function refreshIfChanged() {
  if (document.visibilityState !== "visible" || term !== null || boxFor !== null || pageDrag) return;
  try {
    const seen = await (await fetch(API + "/version")).json();
    if (seen.deck === state.deck_version) return;
    const fresh = await (await fetch(API + "/state")).json();
    if (editing !== null) {   // keep what is typed; only what was sent meanwhile (from a web page) goes in
      addArrived(fresh);
      return;
    }
    if (term !== null || boxFor !== null || pageDrag) return;   // something started meanwhile
    const more = fresh.count > state.count;
    state = fresh;
    draw();   // quietly: the status line keeps what it said
    if (CLIP && more) showNewestCard();
  } catch (error) {
    // the app is not answering; the next action here says so
  }
}
const taken = new Set();   // text from a web page already put in, until the app has let it go

function addArrived(fresh) {
  const card = fresh.cards.find((one) => one.id === editing);
  const editor = document.querySelector(".back-editor");
  if (!card || !editor || !draft) return;
  const mine = (fresh.inbox || []).filter((item) => item.card === editing && !taken.has(item.id));
  for (const item of mine) {
    taken.add(item.id);
    const caret = caretInCard();
    insertAtCursor(caret && caret.editor.dataset.side === "front" && item.exact ? item.exact : item.text);
  }
  if (mine.length) fetch(API + "/inbox/taken", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids: mine.map((item) => item.id) }) }).catch(() => {});
  const shown = new Set([...document.querySelectorAll(".doc-editor img")].map((image) => image.dataset.name));
  for (const [name, src] of Object.entries(card.pictures || {})) {
    const mark = "[[picture:" + name + "]]";
    if (name in editPictures || shown.has(name) || draft.front.includes(mark) || draft.back.includes(mark)) continue;
    const image = element("img");
    image.src = src;
    image.dataset.name = name;
    image.alt = "A picture on this card";
    remember();
    editPictures[name] = src;
    const caret = caretInCard();   // where the cursor last was, Term or Passage; else the end of the passage
    if (caret) {
      const range = caret.range.cloneRange();
      range.collapse(false);
      range.insertNode(image);
      const after = document.createRange();   // a next picture goes after this one
      after.setStartAfter(image);
      after.collapse(true);
      lastCaret = { editor: caret.editor, range: after };
      draft[caret.editor.dataset.side] = docText(caret.editor);
    } else {
      editor.append(image);
      draft.back = docText(editor);
    }
  }   // the rest of the deck is drawn after Save or Cancel
  showCaretMark();
}

function startEditing(id) {
  editing = id;
  draft = null;
  lastCaret = null;
  undoSteps = [];
  redoSteps = [];
  editPictures = {};
  tellEditing(id);   // text and pictures from a web page now go to this card, at its cursor
  say("Editing: whatever you add goes in where the cursor is. Save when the card is right.");
  draw();
}

// Undo in Edit: Ctrl+Z takes back the last thing put in, deleted or typed, one step at a time, and Ctrl+Y (or
// Ctrl+Shift+Z) puts it back. The browser's own undo cannot follow what sentmine puts in, nor an editor drawn again
// when a picture arrives, so the steps are the card's two sides as text, kept here.
let undoSteps = [];   // { front, back } as they were before each step
let redoSteps = [];
let lastTyping = 0;
let editPictures = {};   // name -> address of every picture that has been in the card during this edit

function remember() {
  if (!draft) return;
  const now = { front: draft.front.split(CURSOR).join(""), back: draft.back.split(CURSOR).join("") };
  const last = undoSteps[undoSteps.length - 1];
  if (last && last.front === now.front && last.back === now.back) return;
  undoSteps.push(now);
  if (undoSteps.length > 200) undoSteps.shift();
  redoSteps = [];
  showUndo();
}

function showUndo() {   // Undo and Redo are greyed out when there is nothing to take back or put back
  const undo = document.querySelector(".editing-card .undo-button");
  const redo = document.querySelector(".editing-card .redo-button");
  if (undo) undo.disabled = undoSteps.length === 0;
  if (redo) redo.disabled = redoSteps.length === 0;
}

function stepBack(steps, others) {
  if (!draft || !steps.length) return;
  others.push({ front: draft.front, back: draft.back });
  const to = steps.pop();
  for (const side of ["front", "back"]) {
    const editor = document.querySelector("." + side + "-editor");
    if (!editor || draft[side] === to[side]) continue;
    const from = draft[side];
    draft[side] = to[side];
    fillDoc(editor, to[side], editPictures);
    let same = 0;   // the cursor goes where the two differ
    while (same < from.length && same < to[side].length && from[same] === to[side][same]) same += 1;
    placeCaret(editor, same);
  }
  lastTyping = 0;
  showCaretMark();
  showUndo();
}

// The cursor at a place in a side's text, as docText counts it: a picture counts as its place in the text.
function placeCaret(editor, at) {
  const range = document.createRange();
  let seen = 0, placed = false;
  for (const node of editor.childNodes) {
    const length = node.nodeName === "IMG" ? ("\n[[picture:" + node.dataset.name + "]]\n").length : node.textContent.length;
    if (seen + length >= at) {
      if (node.nodeType === Node.TEXT_NODE) range.setStart(node, Math.max(0, at - seen));
      else range.setStartAfter(node);
      placed = true;
      break;
    }
    seen += length;
  }
  if (!placed) { range.selectNodeContents(editor); range.collapse(false); }
  range.collapse(true);
  lastCaret = { editor, range };
  editor.focus();
  window.getSelection().removeAllRanges();
  window.getSelection().addRange(range.cloneRange());
}

function isPictureDelete(editor, key) {   // whether Backspace or Delete is about to take a picture out
  if (key !== "Backspace" && key !== "Delete") return false;
  const selection = window.getSelection();
  if (!selection.rangeCount) return false;
  const range = selection.getRangeAt(0);
  if (!range.collapsed) return range.cloneContents().querySelector("img") !== null;
  const node = range.startContainer, offset = range.startOffset;
  const beside = node === editor ? editor.childNodes[key === "Backspace" ? offset - 1 : offset]
    : node.nodeType === Node.TEXT_NODE && key === "Backspace" && offset === 0 ? node.previousSibling
    : node.nodeType === Node.TEXT_NODE && key === "Delete" && offset === node.textContent.length ? node.nextSibling : null;
  return !!beside && beside.nodeName === "IMG";
}

document.addEventListener("keydown", (event) => {
  if (editing === null || !(event.ctrlKey || event.metaKey) || event.altKey) return;
  const active = document.activeElement;
  if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) return;   // the deck name keeps its own undo
  const key = event.key.toLowerCase();
  if (key === "z" && !event.shiftKey) {
    event.preventDefault();
    stepBack(undoSteps, redoSteps);
  } else if (key === "y" || (key === "z" && event.shiftKey)) {
    event.preventDefault();
    stepBack(redoSteps, undoSteps);
  }
}, true);

function showNewestCard() {
  const cards = $("cards").children;
  if (cards.length) cards[cards.length - 1].scrollIntoView({ block: "nearest" });
}

// The edit mode: the page tells the app which card is open in Edit, again every 30 seconds while it is, so that
// text and pictures from a web page go to it; and again when it closes.
function tellEditing(card, keepalive = false) {
  // in the side panel, the extension names its right-click items after it: "Add to the card you are editing"
  if (window.parent !== window) window.parent.postMessage({ sentmine: "editing", editing: card !== null }, "*");
  return fetch(API + "/editing", { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ card }), keepalive }).catch(() => {});
}

function closeEditing() {
  undoSteps = [];
  redoSteps = [];
  editPictures = {};
  tellEditing(null);
  editing = null;
  draft = null;
  lastCaret = null;
  taken.clear();
  draw();
}

setInterval(() => { if (editing !== null) tellEditing(editing); }, 30000);
window.addEventListener("pagehide", () => { if (editing !== null) tellEditing(null, true); });

function editHint() {
  const parts = CLIP ? ["Everything goes in where the cursor is: right-click text or a picture on the web page"]
    : ["Everything goes in where the cursor is: click a sentence in the text"];
  if (state.pdf && !CLIP) parts.push("drag a box on the PDF page for a picture");
  parts.push(CLIP ? "or paste a picture (Ctrl+V)" : "paste a picture (Ctrl+V)");
  if (!CLIP) parts.push("or right-click text or a picture on a web page");
  return parts.join(", ") + ". To remove a picture, click it and press Delete; Undo takes back the last step. Save when the card is right.";
}

// The sentences `first` to `last` of the text, as one passage: a space between sentences, a blank line between
// paragraphs.
function sentencesText(first, last) {
  const paragraphs = [];
  for (const paragraph of state.paragraphs) {
    const chosen = paragraph.filter((drawn) => drawn.sentence >= first && drawn.sentence <= last)
      .map((drawn) => drawn.pieces.map((piece) => piece.text).join(""));
    if (chosen.length) paragraphs.push(chosen.join(" "));
  }
  return paragraphs.join("\n\n");
}

// What a click or a drag in the text puts in at the cursor: in the Term, the words themselves (the term); in the
// Passage, their whole sentences.
function putIn(first, last, words) {
  const caret = caretInCard();
  if (caret && caret.editor.dataset.side === "front" && words) insertAtCursor(words);
  else insertSentences(first, last);
}

function insertSentences(first, last) {
  const text = sentencesText(Math.min(first, last), Math.max(first, last));
  if (text) insertAtCursor(text);
}

// Text put in where the cursor last was, Term or Passage (the end of the Passage when there is none), with a
// space before it when it would touch a word; the cursor goes on after it.
function insertAtCursor(text) {
  remember();
  const caret = caretInCard();
  const editor = caret ? caret.editor : document.querySelector(".back-editor");
  if (!editor || !draft) return;
  let range;
  if (caret) {
    range = caret.range.cloneRange();
    range.collapse(false);
  } else {
    range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
  }
  const before = document.createRange();
  before.selectNodeContents(editor);
  before.setEnd(range.startContainer, range.startOffset);
  const rest = document.createRange();
  rest.selectNodeContents(editor);
  rest.setStart(range.endContainer, range.endOffset);
  const touchesBefore = before.toString() && !/\s$/.test(before.toString());
  const touchesAfter = rest.toString() && !/^\s/.test(rest.toString());
  const node = document.createTextNode((touchesBefore ? " " : "") + text + (touchesAfter ? " " : ""));
  range.insertNode(node);
  const after = document.createRange();   // just after the text, before the space that keeps it off the next word
  after.setStart(node, node.length - (touchesAfter ? 1 : 0));
  after.collapse(true);
  lastCaret = { editor, range: after };
  if (editor.contains(document.activeElement) || document.activeElement === editor) {   // the real cursor moves on too
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(after.cloneRange());
  }
  draft[editor.dataset.side] = docText(editor);
  say("Put in the card where the cursor is.");
  showCaretMark();
}

// A thin line where the next sentence or picture will go, while the cursor itself is elsewhere (on the PDF, on a
// web page). Hidden while typing in the card, where the real cursor shows the place.
function showCaretMark() {
  const mark = document.querySelector(".editing-card .caret-mark");
  if (!mark) return;
  const caret = caretInCard();
  const typing = caret && caret.editor.contains(document.activeElement);
  if (!caret || typing) { mark.hidden = true; return; }
  const range = caret.range.cloneRange();
  range.collapse(false);
  const node = range.startContainer, offset = range.startOffset;
  const before = node.nodeType === Node.TEXT_NODE ? (offset === 0 ? node.previousSibling : null) : node.childNodes[offset - 1];
  let place = range.getClientRects()[0];
  if (before && before.nodeName === "IMG" && !(place && place.height)) {   // just after a picture: at its right edge, by its foot
    const picture = before.getBoundingClientRect();
    place = { left: picture.right + 2, top: picture.bottom - 22, height: 22 };
  }
  if (!place) {   // an empty spot has no box of its own: a zero-width mark there has one
    const probe = document.createTextNode("\u200b");
    range.insertNode(probe);
    place = probe.parentNode ? (() => { const r = document.createRange(); r.selectNode(probe); return r.getBoundingClientRect(); })() : null;
    probe.remove();
    caret.editor.normalize();
  }
  if (!place) { mark.hidden = true; return; }
  const box = mark.parentElement.getBoundingClientRect();
  Object.assign(mark.style, { left: place.left - box.left + "px", top: place.top - box.top + "px", height: Math.max(place.height, 16) + "px" });
  mark.hidden = false;
}

document.addEventListener("focusin", showCaretMark);
document.addEventListener("focusout", () => setTimeout(showCaretMark, 0));

setInterval(refreshIfChanged, 2000);
// The extension's side panel says when it sent something (a clip, or text for the card open in Edit): look now.
window.addEventListener("message", (event) => {
  if (event.data === "sentmine:refresh" && /^(chrome-)?extension:\/\//.test(event.origin)) refreshIfChanged();
});
document.addEventListener("visibilitychange", refreshIfChanged);

function mayReplaceCards() {   // only the cards from the text in Read go; cards from web pages stay
  const going = state.cards.filter((card) => card.source === "read").length;
  return going === 0 || window.confirm("Reading a new text removes the " + going + (going === 1 ? " card" : " cards") +
    " made from this text that you have not downloaded. Cards from web pages stay. Continue?");
}

function textLoaded() {
  editing = null;
  term = null;
  $("paste").value = "";
  $("paste-box").open = false;
  $("paste-box").querySelector("summary").textContent = "Paste or open another text";
}

$("load").addEventListener("click", () => {
  if (!mayReplaceCards()) return;
  busy($("load"), "Reading…", async () => {
    if (await call("POST", "/api/text", { text: $("paste").value })) textLoaded();
  });
});

$("file").addEventListener("change", async () => {
  const chosen = $("file").files[0];
  if (chosen && mayReplaceCards()) {
    say("Reading " + chosen.name + "…");
    const form = new FormData();
    form.append("file", chosen);
    $("file").disabled = true;
    try {
      if (await call("POST", "/api/file", form)) textLoaded();
    } finally {
      $("file").disabled = false;
    }
  }
  $("file").value = "";   // so that choosing the same file again works
});

$("download").addEventListener("click", () => busy($("download"), "Making the deck…", download));
$("send").addEventListener("click", () =>
  busy($("send"), "Sending…", () => call("POST", API + "/send", { deck: $("deck-name").value })));

async function download() {
  let response;
  try {
    response = await fetch(API + "/deck?name=" + encodeURIComponent($("deck-name").value));
  } catch (error) {
    say("The app is not answering. Is `sentmine` still running in the terminal?", true);
    return;
  }
  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    say(data.error || "The deck could not be made.", true);
    return;
  }
  const named = /filename="?([^";]+)"?/.exec(response.headers.get("Content-Disposition") || "");
  const link = element("a");
  link.href = URL.createObjectURL(await response.blob());
  link.download = named ? named[1] : ($("deck-name").value.trim() || "new") + ".apkg";
  document.body.append(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);
  const warning = response.headers.get("X-Sentmine-Warning");
  if (warning) {
    say("Downloaded " + link.download + ". " + decodeURIComponent(warning), true);
  } else {
    say("Downloaded " + link.download + " (" + state.count_text + "). Now in My cards too.");
  }
}

// The reader's place in the text is kept for this tab, so coming back from My cards or
// reloading shows the same page of the PDF, not the top. It is restored once, when the page opens.
const PLACE_KEY = "sentmine-place";

function textTop() {   // where the text starts below the header and status line that stay in view
  return Math.max(0, $("status").getBoundingClientRect().bottom);
}

function savePlace() {
  if (!state.text_id) return;
  let place = { text: state.text_id, y: Math.round(window.scrollY) };
  if (state.pdf) {
    const page = [...document.querySelectorAll(".pdf-page")].find((one) => one.getBoundingClientRect().bottom > textTop());
    if (page) {
      const r = page.getBoundingClientRect();
      place = { text: state.text_id, page: Number(page.dataset.page), within: (textTop() - r.top) / r.height };
    }
  }
  try { sessionStorage.setItem(PLACE_KEY, JSON.stringify(place)); } catch (error) {}   // not kept if the browser does not allow it
}

let placeSaving = null;
window.addEventListener("scroll", () => {
  clearTimeout(placeSaving);
  placeSaving = setTimeout(savePlace, 200);
}, { passive: true });

function restorePlace() {
  let place = null;
  try { place = JSON.parse(sessionStorage.getItem(PLACE_KEY)); } catch (error) {}
  if (!place || place.text !== state.text_id) return;
  const page = place.page === undefined ? null : document.querySelectorAll(".pdf-page")[place.page];
  if (page) {
    const r = page.getBoundingClientRect();
    window.scrollTo(0, window.scrollY + r.top + place.within * r.height - textTop());
  } else if (place.page === undefined) {
    window.scrollTo(0, place.y);
  }
}

// The data the page first shows comes inside it, so the page is drawn complete in its first frame.
// Without it (or if it cannot be read) the page asks the app, as before.
function firstData() {
  try {
    const holder = document.getElementById("first-data");
    return holder ? JSON.parse(holder.textContent) : null;
  } catch (error) {
    return null;
  }
}
function opened(loaded) {
  if (loaded && loaded.memory_warning) {
    say(loaded.memory_warning + " Earlier cards will not be found, and new ones will not be remembered.", true);
  }
  if (loaded && loaded.paragraphs.length > 0) {
    $("paste-box").open = false;
    $("paste-box").querySelector("summary").textContent = "Paste or open another text";
    if (CLIP) {
      showNewestCard();
    } else {
      restorePlace();
    }
  }
}

const first = firstData();
if (first) {
  opened(use(first));
} else {
  call("GET", API + "/state").then(opened);
}
</script>
</body>
</html>
